[project]
name = "open-proxy-mcp"
version = "2.5.0"
description = "DART 공시 데이터를 MCP 프로토콜로 제공하는 서버"
requires-python = ">=3.10"
dependencies = [
    # 2026-07-28 mcp 2.0.0 정식 릴리즈에서 `mcp.server.fastmcp` 가 제거됐다.
    # 상한이 없어 도커 빌드가 2.0.0 을 집어 서버가 부팅 즉시 죽었다(운영 중단).
    "mcp[cli]>=1.6.0,<2",
    "httpx>=0.28.1",
    "python-dotenv>=1.0.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "psycopg[binary]>=3.2.0",
    # law_lookup Signal C: 조문 전문 BM25용 형태소 분석기(순수 C++·오프라인·결정적, Java 불필요).
    # 런타임 질의 토큰화 + sync 인덱스 빌드가 동일 morph_tokens를 씀. kiwipiepy_model 자동 동반.
    "kiwipiepy>=0.20.0",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40.0", "openai>=1.50.0"]
# NOTE: pdf extra(opendataloader-pdf, PyPDF2)는 2026-07-12 제거 —
#       PDF 다운로드·OCR 경로를 open-proxy-ai로 이관하고 OPM은 XML 단독 유지.
all = ["open-proxy-mcp[llm]"]

[project.license]
text = "LicenseRef-PolyForm-Noncommercial-1.0.0"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
