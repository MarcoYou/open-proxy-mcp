# fly.toml app configuration file generated for open-proxy-mcp on 2026-04-13T04:26:29Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'open-proxy-mcp'
primary_region = 'nrt'

[build]

[env]
  # sqlite master cache (corpCode 영구화) — fly volume mount 위치
  OPM_MASTER_DB_PATH = '/data/master.db'
  # 문서 디스크 캐시도 볼륨으로. 종전 기본값 /tmp/opm_cache 는 컨테이너 이미지 안이라
  # **배포마다 통째로 사라졌다** — 메모리 캐시가 죽는 그 순간 받침도 같이 죽었다.
  # 260810 실측: 배포 직후 적중률 0%, 디스크 적중 24h 13건. 예산·청소는 client.py 참조.
  OPM_DOC_CACHE_DIR = '/data/opm_cache'

[mounts]
  source = 'opm_data'
  destination = '/data'

[http_service]
  internal_port = 8000
  force_https = true
  # 'suspend' = 메모리 snapshot 유지 → 재시작 ms 단위 (cold start 페널티 제거).
  # 'stop'은 완전 종료라 재시작마다 Python boot + FastMCP init 5-15s 발생.
  # 2026-04-13 "Fly.io Launch" 자동 덮어쓰기로 stop이 됐었음 → suspend 복구 (260507).
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  # 1대 항상 가동 — cold start 페널티 (3-6s) 제거.
  # 'suspend' 모드여도 idle 시 Firecracker VM 재시작 + Python boot + memory cache 휘발.
  # min=1이면 corpCode sqlite/memory cache + doc LRU cache 영구 유지 → ms 응답.
  # 비용: shared-cpu-1x 1GB 월 ~$5.4/대 (24/7 × 30d). nrt 2대 = ~$11.
  # 사용자 대부분 한국 → 도쿄(nrt) 2대로 latency(~40ms) + 머신 redundancy 동시 확보.
  min_machines_running = 2
  processes = ['app']

  # 260824: **부하를 무엇으로 세는가.** 이걸 안 적으면 fly 는 `type='connections'`,
  # soft_limit=20 으로 센다. 그런데 fly 프록시는 스스로 연결을 모아 재사용하므로
  # 요청 수십 건이 연결 두어 개로 보인다 — 카운터가 20 에 닿을 일이 없어 **두 번째
  # 머신으로 넘어가는 일이 영영 없다.**
  # 실측(event_id 의 머신 필드로 역산): 동시 32·18·15·12 건이 몰린 7월의 네 구간 모두
  #   **222/222·366/366·88/88·111/111 건이 한 머신**. 다른 한 대는 그 시간 내내 놀았다.
  #   business_details 178초는 그렇게 만들어진 줄이었다(같은 호출이 한가할 땐 0.7초).
  # 그래서 요청 수로 세게 하고 기준선을 코어 하나가 감당할 만큼 낮춘다. shared-cpu-1x
  #   한 개 위에서 파싱은 동기 코드라 사실상 직렬이다 — 로컬 실측으로도 동시 8건이면
  #   마지막 건이 단독의 4.7배가 된다.
  # hard_limit 은 **일부러 두지 않는다.** 지금은 상한이 없고(fly 기본), 상한을 두면
  #   「느려진다」가 「거절당한다」로 실패 모양이 바뀐다 — 겪어 본 적 없는 실패를
  #   이번 변경에 끼워 넣지 않는다. 여기서 바꾸는 건 **저울 눈금 하나**다.
  [http_service.concurrency]
    type = 'requests'
    soft_limit = 4

  # 260729 사고: 헬스체크가 없어 fly 가 「VM 이 켜졌다」만 보고 배포를 성공 처리했다.
  # 앱은 부팅 즉시 죽어 8000 포트에 아무도 리스닝하지 않았는데도 CI 는 초록이었다.
  # 이제 /health 가 200 을 못 내면 fly 가 그 머신을 unhealthy 로 보고 배포가 실패한다.
  [[http_service.checks]]
    grace_period = '15s'
    interval = '30s'
    method = 'GET'
    timeout = '5s'
    path = '/health'

# 260804 사고: 768MB 로는 doc 캐시가 찬 상태에서 OOM(exit_code=137)이 나 머신이
# 재시작 한도를 소진했다. fly 는 머신을 started 로 두는데 8000 포트가 죽어 있어
# 프록시가 "no known healthy instances" 로 전면 다운. 머신도 1대뿐이라 안전망이 없었다.
# client.py 의 캐시 메모리 예산 주석이 원래 1GB 를 가정하고 쓰였으므로 거기에 맞춘다.
# ※ 캐시 상한은 그 뒤 전부 붙었다 — 문서 96MB / 배당 16MB(+TTL 24h) / 디스크 640MB(LRU·바이트 트리거).
#    (이 주석은 260810 까지 「_viewer_doc_cache 각 200 엔트리, _dividend_cache 는 상한 없음」
#     이라고 적혀 있었는데 둘 다 이미 사실이 아니었다. 낡은 주석이 미해결을 가리키면
#     고칠 것이 남은 줄 알고 같은 조사를 반복하게 된다.)
[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
