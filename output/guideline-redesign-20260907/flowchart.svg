<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="t d"><title id="t">OPM 가이드라인의 정책 준비와 안건 적용 흐름</title><desc id="d">정책 원문을 검토하여 승인한 규칙팩을 준비한다. 실행 시 대상과 시점을 고정하고 OPM 원문 자료를 수집한다. LLM은 사실 후보와 반증을 추출한다. 검증 후 규칙을 평가하고 사람이 검토하여 권고와 근거를 반환한다. 누락 자료는 제한된 횟수로 보완한다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#47858a"/></marker><marker id="soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#a97736"/></marker></defs><rect width="1600" height="1120" rx="18" fill="#f7f9f8"/><style>text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}.title{font-weight:750;font-size:32px;fill:#143541}.sub{font-size:17px;fill:#546f77}.lane{font-size:15px;font-weight:700;letter-spacing:1px;fill:#31747b}.nt{font-size:20px;font-weight:700;fill:#153743}.nb{font-size:16px;fill:#496772}.tiny{font-size:13px;fill:#5a757b}.edge{fill:none;stroke:#47858a;stroke-width:2.6;marker-end:url(#arrow)}.retry{fill:none;stroke:#a97736;stroke-width:2.2;stroke-dasharray:7 5;marker-end:url(#soft)}</style><text class="title" x="60" y="65">정책은 승인하고, 사실은 검증하고, 판단 근거는 남깁니다</text><text class="sub" x="60" y="100">설계 제안 · 기존 OPM 원문/지표 활용 · LLM 추출 후보와 승인된 판단을 분리</text><rect x="35" y="135" width="1530" height="235" rx="15" fill="#eaf1f0"/><text class="lane" x="60" y="172">A. 정책 준비  /  원문이 바뀔 때 수행</text><rect x="60" y="198" width="320" height="140" rx="12" fill="#fff" stroke="#b9d0d2"/><text class="tiny" x="80" y="223">SOURCE</text><text class="nt" x="80" y="253">공식 정책·법규 원문</text><text class="nb" x="80" y="283">기관·판본·조항·시행일</text><text class="nb" x="80" y="308">경과조치·대상·원문 위치</text><rect x="435" y="198" width="320" height="140" rx="12" fill="#fff" stroke="#b9d0d2"/><text class="tiny" x="455" y="223">DRAFT</text><text class="nt" x="455" y="253">LLM이 규칙 초안 작성</text><text class="nb" x="455" y="283">조건·예외·모호한 표현 분해</text><text class="nb" x="455" y="308">근거 없는 문턱은 새로 만들지 않음</text><rect x="810" y="198" width="320" height="140" rx="12" fill="#fff" stroke="#b9d0d2"/><text class="tiny" x="830" y="223">APPROVAL</text><text class="nt" x="830" y="253">정책 담당자·법률 검토</text><text class="nb" x="830" y="283">원문 충실성·예외·적용대상 확인</text><text class="nb" x="830" y="308">JSON 검사 + 명세 사례 검증</text><rect x="1185" y="198" width="320" height="140" rx="12" fill="#d9eeea" stroke="#b9d0d2"/><text class="tiny" x="1205" y="223">VERSION</text><text class="nt" x="1205" y="253">승인된 규칙팩 고정</text><text class="nb" x="1205" y="283">정책 버전·해시·승인 기록</text><text class="nb" x="1205" y="308">HTML과 실행 규칙 동시 생성</text><path class="edge" d="M380 268 H428"/><path class="edge" d="M755 268 H803"/><path class="edge" d="M1130 268 H1178"/><text class="lane" x="60" y="426">B. 안건 적용  /  분석 요청마다 수행</text><rect x="60" y="455" width="320" height="160" rx="12" fill="#fff" stroke="#b9d0d2"/><text class="tiny" x="80" y="480">01 · REQUEST</text><text class="nt" x="80" y="510">대상·정책·시점 고정</text><text class="nb" x="80" y="540">회사·주총·실제 표결 단위</text><text class="nb" x="80" y="565">기관팩 또는 OPM팩 선택</text><text class="nb" x="80" y="590">기준일·관찰기간·안건 관계</text><rect x="435" y="455" width="320" height="160" rx="12" fill="#fff" stroke="#b9d0d2"/><text class="tiny" x="455" y="480">02 · OPM</text><text class="nt" x="455" y="510">원문·기존 지표 수집</text><text class="nb" x="455" y="540">DART 공고·보고서·정관</text><text class="nb" x="455" y="565">재무·후보·배당·보수·거래</text><text class="nb" x="455" y="590">값이 없으면 위치·다음 경로</text><rect x="810" y="455" width="320" height="160" rx="12" fill="#fff" stroke="#b9d0d2"/><text class="tiny" x="830" y="480">03 · LLM</text><text class="nt" x="830" y="510">사실 후보와 쟁점 추출</text><text class="nb" x="830" y="540">원문 인용·회사/후보/기간</text><text class="nb" x="830" y="565">정성 판단의 근거·반증·소명</text><text class="nb" x="830" y="590">계산·예외 승인은 맡기지 않음</text><rect x="1185" y="455" width="320" height="160" rx="12" fill="#fff" stroke="#b9d0d2"/><text class="tiny" x="1205" y="480">04 · VALIDATE</text><text class="nt" x="1205" y="510">사실·판단의 검증</text><text class="nb" x="1205" y="540">단위·분모·시점·원문 일치</text><text class="nb" x="1205" y="565">정성 판단은 검토자가 수용</text><text class="nb" x="1205" y="590">미확인은 false로 변환 금지</text><path class="edge" d="M380 535 H428"/><path class="edge" d="M755 535 H803"/><path class="edge" d="M1130 535 H1178"/><path class="retry" d="M1345 615 V672 H595 V622"/><rect x="736" y="651" width="470" height="40" rx="6" fill="#fff2dd"/><text class="tiny" x="753" y="676">누락·충돌 → 필요한 원문만 최대 2회 보완 → 미해결은 검토</text><rect x="1185" y="752" width="320" height="175" rx="12" fill="#d9eeea" stroke="#b9d0d2"/><text class="tiny" x="1205" y="777">05 · RULE ENGINE</text><text class="nt" x="1205" y="807">조건 평가·안건 합성</text><text class="nb" x="1205" y="837">참 / 거짓 / 미확정</text><text class="nb" x="1205" y="862">법규 → 정책 → 예외 → 묶음</text><text class="nb" x="1205" y="887">반대 근거와 미해결 항목 보존</text><rect x="810" y="752" width="320" height="175" rx="12" fill="#fff" stroke="#b9d0d2"/><text class="tiny" x="830" y="777">06 · HUMAN</text><text class="nt" x="830" y="807">검토와 최종 결정</text><text class="nb" x="830" y="837">정책상 권고·소명·반증 확인</text><text class="nb" x="830" y="862">재량 선택·변경 이유 기록</text><text class="nb" x="830" y="887">책임 있는 승인 주체 명시</text><rect x="435" y="752" width="320" height="175" rx="12" fill="#fff" stroke="#b9d0d2"/><text class="tiny" x="455" y="777">07 · RESPONSE</text><text class="nt" x="455" y="807">권고 + 상태 + 근거</text><text class="nb" x="455" y="837">찬성·반대·기권·판단 보류</text><text class="nb" x="455" y="862">검토 필요·자료 부족·표결 없음</text><text class="nb" x="455" y="887">사용자에게 원문까지 연결</text><rect x="60" y="752" width="320" height="175" rx="12" fill="#fff" stroke="#b9d0d2"/><text class="tiny" x="80" y="777">08 · AUDIT</text><text class="nt" x="80" y="807">재현·평가·정책 개선</text><text class="nb" x="80" y="837">버전·사실·규칙·변경 이력</text><text class="nb" x="80" y="862">사용자 결과는 서버 기본 저장 X</text><text class="nb" x="80" y="887">승인된 외부 저장소/사용자 내보내기</text><path class="edge" d="M1505 535 H1537 V730 H1345 V746"/><path class="edge" d="M1185 835 H1137"/><path class="edge" d="M810 835 H762"/><path class="edge" d="M435 835 H387"/><path class="edge" d="M1505 268 H1554 V959 H1345 V934"/><text class="tiny" x="1108" y="981">규칙팩은 실행 중 임의 수정하지 않습니다</text><rect x="60" y="1015" width="1445" height="62" rx="10" fill="#123644"/><text x="85" y="1053" font-size="18" fill="#eff8f7">표결 없음은 즉시 종료 · 정책팩이 없으면 대체 적용 금지 · 검증 실패는 자료 부족으로 보존 · 실제 투표 전송은 별도 업무</text></svg>