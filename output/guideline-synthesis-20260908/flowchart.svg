<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1060" viewBox="0 0 1440 1060" role="img" aria-labelledby="title desc"><title id="title">OPM 정책 컴파일과 근거 적용·갱신 흐름</title><desc id="desc">정책을 검증해 고정한 뒤 원문에서 수용된 근거로 모든 규칙을 평가한다. 자료 갱신과 정책 갱신은 각각 영향 분석과 승인 경로를 따른다.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#677786" stroke-width="1.5"/></marker></defs><style>text{font-family:Arial,'Apple SD Gothic Neo',sans-serif}.title{font-size:27px;font-weight:700;fill:#153546}.label{font-size:21px;font-weight:700;fill:#153546}.sub{font-size:17px;fill:#485e6b}.tag{font-size:15px;fill:#266d60}.line{fill:none;stroke:#677786;stroke-width:2;marker-end:url(#arrow)}</style><rect width="1440" height="1060" fill="#f8f8f3"/><text x="40" y="46" class="title">01  정책을 먼저 고정한다</text><rect x="40" y="74" width="390" height="110" rx="14" fill="#ffffff" stroke="#cbd7d8"/><text x="60" y="108" class="label">작성 정책 + 선택한 변경</text><text x="60" y="138" class="sub">OPM 기준 · 법률/기관 팩의 출처</text><text x="60" y="161" class="sub">범위가 정해진 고객 파라미터</text><rect x="500" y="74" width="370" height="110" rx="14" fill="#ffffff" stroke="#cbd7d8"/><text x="520" y="108" class="label">컴파일 / 검토</text><text x="520" y="138" class="sub">타입·단위·참조·기간·예외·충돌</text><text x="520" y="161" class="sub">해석 미확정 / 불가 변경은 거절</text><rect x="940" y="74" width="460" height="110" rx="14" fill="#e2eee8" stroke="#cbd7d8"/><text x="960" y="108" class="label">ResolvedPolicy</text><text x="960" y="138" class="sub">상속을 푼 규칙 · 실제 적용 값 · 변경 이유</text><text x="960" y="161" class="sub">정책/스키마/rubric 버전 + 내용 hash</text><path d="M430,130 L500,130" class="line"/><path d="M870,130 L940,130" class="line"/><text x="40" y="255" class="title">02  필요한 근거를 확보하고 판단한다</text><rect x="40" y="290" width="250" height="110" rx="14" fill="#ffffff" stroke="#cbd7d8"/><text x="60" y="324" class="label">요청 범위 / 계획</text><text x="60" y="354" class="sub">회의 · 후보 · as_of</text><text x="60" y="377" class="sub">필요 지표부터 역추적</text><rect x="322" y="290" width="250" height="110" rx="14" fill="#ffffff" stroke="#cbd7d8"/><text x="342" y="324" class="label">원문 + 조회 힌트</text><text x="342" y="354" class="sub">OPM 공개 자료 / 파생값</text><text x="342" y="377" class="sub">값이 없으면 다음 경로</text><rect x="604" y="290" width="250" height="110" rx="14" fill="#ffffff" stroke="#cbd7d8"/><text x="624" y="324" class="label">LLM 과업</text><text x="624" y="354" class="sub">추출 · 연결 · 평가</text><text x="624" y="377" class="sub">인용 / 반증 / 미해결</text><rect x="886" y="290" width="250" height="110" rx="14" fill="#ffffff" stroke="#cbd7d8"/><text x="906" y="324" class="label">근거 수용 검사</text><text x="906" y="354" class="sub">주체 · 기간 · 단위 · 인용</text><text x="906" y="377" class="sub">사실과 승인 평가 분리</text><rect x="1168" y="290" width="232" height="110" rx="14" fill="#e2eee8" stroke="#cbd7d8"/><text x="1188" y="324" class="label">모든 규칙 평가</text><text x="1188" y="354" class="sub">3값 + 예외 + 적용성</text><text x="1188" y="377" class="sub">결정적 결합</text><path d="M290,345 L322,345" class="line"/><path d="M572,345 L604,345" class="line"/><path d="M854,345 L886,345" class="line"/><path d="M1136,345 L1168,345" class="line"/><path d="M1170,184 L1170,232 L1285,232 L1285,290" class="line"/><rect x="886" y="455" width="514" height="115" rx="14" fill="#e2eee8" stroke="#cbd7d8"/><text x="906" y="489" class="label">분리된 결과 / 다음 행동</text><text x="906" y="519" class="sub">권고 · 미해결 · 법률 상태 · 의결권 자격</text><text x="906" y="542" class="sub">검토 / 추가 조회 / 투표 계획 — 제출은 별도</text><path d="M1285,400 L1285,455" class="line"/><path d="M1010,400 L1010,424 L447,424 L447,400" class="line"/><text x="455" y="450" class="tag">수용 실패 → 부족한 근거만 다시 조회</text><rect x="40" y="482" width="785" height="115" rx="14" fill="#eef0f5" stroke="#cbd7d8"/><text x="60" y="516" class="label">공개와 개인 정보의 경계</text><text x="60" y="546" class="sub">서버: 공개 원문·검증 사실 캐시 / 사용자 조회 결과는 기본 저장하지 않음</text><text x="60" y="569" class="sub">클라이언트: 보유·위임·private overlay·참여 이력·개별 실행 manifest</text><text x="40" y="670" class="title">03  변경 종류에 맞춰 갱신한다</text><rect x="40" y="706" width="390" height="110" rx="14" fill="#ffffff" stroke="#cbd7d8"/><text x="60" y="740" class="label">공시 / 근거 변경</text><text x="60" y="770" class="sub">정정 · 신규 자료 · 시점 확인</text><text x="60" y="793" class="sub">source → fact → rule 영향 그래프</text><rect x="500" y="706" width="370" height="110" rx="14" fill="#ffffff" stroke="#cbd7d8"/><text x="520" y="740" class="label">영향받는 분석만 재실행</text><text x="520" y="770" class="sub">현재 as_of에 사용할 수 있는 자료만</text><text x="520" y="793" class="sub">변경 전후 근거·판단 차분</text><rect x="940" y="706" width="460" height="110" rx="14" fill="#ffffff" stroke="#cbd7d8"/><text x="960" y="740" class="label">자료 갱신 결과</text><text x="960" y="770" class="sub">같은 정책 버전으로 새 실행 생성</text><text x="960" y="793" class="sub">과거 실행은 유지 · 알림은 고객 설정</text><path d="M430,760 L500,760" class="line"/><path d="M870,760 L940,760" class="line"/><rect x="40" y="884" width="390" height="110" rx="14" fill="#ffffff" stroke="#cbd7d8"/><text x="60" y="918" class="label">법령 / 정책 원문 변경</text><text x="60" y="948" class="sub">표현·위치 변화 vs 의미 변화</text><text x="60" y="971" class="sub">조항별 후보 변경안</text><rect x="500" y="884" width="370" height="110" rx="14" fill="#ffffff" stroke="#cbd7d8"/><text x="520" y="918" class="label">컴파일 · 영향 평가 · 승인</text><text x="520" y="948" class="sub">의미 변경은 기본 검토 대상</text><text x="520" y="971" class="sub">독립 평가 / 사전 위임 범위 검사</text><rect x="940" y="884" width="460" height="110" rx="14" fill="#e2eee8" stroke="#cbd7d8"/><text x="960" y="918" class="label">새 정책 활성화 / 복구</text><text x="960" y="948" class="sub">불변 버전 + active 포인터</text><text x="960" y="971" class="sub">실패 시 이전 검증 버전으로 복구</text><path d="M430,938 L500,938" class="line"/><path d="M870,938 L940,938" class="line"/><text x="40" y="1038" class="tag">설계 제안 · 실제 모니터/정책 자동 승격/의결권 제출은 아직 구현하지 않음</text></svg>