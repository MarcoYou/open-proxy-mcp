<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 610" role="img" aria-labelledby="runtime-title"><title id="runtime-title">현재 MCP의 원문·평가·판정 흐름</title><defs><marker id="arr-runtime" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 1L8 5L0 9" fill="none" stroke="#53756c" stroke-width="1.5"/></marker></defs><rect width="1100" height="610" rx="20" fill="#f0f4ef"/><style>text{font-family:Arial,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;fill:#17372e}.t{font-size:21px;font-weight:700}.s{font-size:16px}.n{font-size:13px;fill:#557b6e}</style><text x="35" y="40" class="t">현재 MCP의 원문·평가·판정 흐름</text><rect x="35" y="65" width="290" height="118" rx="12" fill="white" stroke="#acc5b9"/><text x="53" y="90" class="n">01 · REQUEST</text><text x="53" y="120" class="t">회사·정확한 공고 고정</text><text x="53" y="149" class="s">cutoff_at · 소집공고 접수번호</text><text x="53" y="171" class="s">정기/임시 · 보팅 설정 확인</text><rect x="405" y="65" width="290" height="118" rx="12" fill="white" stroke="#acc5b9"/><text x="423" y="90" class="n">02 · EVIDENCE</text><text x="423" y="120" class="t">공개시점 검사·수집</text><text x="423" y="149" class="s">마감일 전일까지 · 최신 캐시 제외</text><text x="423" y="171" class="s">누락·시점 불명은 알리고 진행</text><rect x="775" y="65" width="290" height="118" rx="12" fill="white" stroke="#acc5b9"/><text x="793" y="90" class="n">03 · TASK</text><text x="793" y="120" class="t">실행·정책·원문 연결</text><text x="793" y="149" class="s">엔진 · 정책 · 원문 해시</text><text x="793" y="171" class="s">task_id · continuation 반환</text><rect x="775" y="240" width="290" height="118" rx="12" fill="white" stroke="#acc5b9"/><text x="793" y="265" class="n">04 · CALLER LLM</text><text x="793" y="295" class="t">교체 가능한 모델 실행</text><text x="793" y="324" class="s">목록 탐색 / 원문 읽기·교체</text><text x="793" y="346" class="s">평가 제출 / 종료 · 후보별 예산</text><rect x="405" y="240" width="290" height="118" rx="12" fill="white" stroke="#acc5b9"/><text x="423" y="265" class="n">05 · VALIDATE</text><text x="423" y="295" class="t">동일 실행·인용 검사</text><text x="423" y="324" class="s">시각 · 정책 · 원문 · 과업 대조</text><text x="423" y="346" class="s">바뀐 후보 과업만 다시 평가</text><rect x="35" y="240" width="290" height="118" rx="12" fill="white" stroke="#acc5b9"/><text x="53" y="265" class="n">06 · METRICS</text><text x="53" y="295" class="t">수용 평가를 지표로</text><text x="53" y="324" class="s">원문 판독 · 기간·출석 계산</text><text x="53" y="346" class="s">누락 기준 제외 · 나머지 진행</text><rect x="35" y="415" width="290" height="118" rx="12" fill="white" stroke="#acc5b9"/><text x="53" y="440" class="n">07 · RULES</text><text x="53" y="470" class="t">규칙별 상태와 권고</text><text x="53" y="499" class="s">반대 신호 보존 · 긍정 게이트</text><text x="53" y="521" class="s">재직·정지 구간과 회의 수 계산</text><rect x="405" y="415" width="290" height="118" rx="12" fill="white" stroke="#acc5b9"/><text x="423" y="440" class="n">08 · CONSTRAINTS</text><text x="423" y="470" class="t">교정과 보호 범위</text><text x="423" y="499" class="s">추출 오류 REVIEW만 근거별 교정</text><text x="423" y="521" class="s">당시 공개 법령 · 표결 제약 적용</text><rect x="775" y="415" width="290" height="118" rx="12" fill="white" stroke="#acc5b9"/><text x="793" y="440" class="n">09 · RESULT</text><text x="793" y="470" class="t">권고와 처리 경로</text><text x="793" y="499" class="s">자동 준비 / 일부·전체 수동</text><text x="793" y="521" class="s">사람 미검토 · 실제 투표 전송 없음</text><path d="M325 124H405" fill="none" stroke="#53756c" stroke-width="2" marker-end="url(#arr-runtime)"/><path d="M695 124H775" fill="none" stroke="#53756c" stroke-width="2" marker-end="url(#arr-runtime)"/><path d="M920 183V240" fill="none" stroke="#53756c" stroke-width="2" marker-end="url(#arr-runtime)"/><path d="M775 299H695" fill="none" stroke="#53756c" stroke-width="2" marker-end="url(#arr-runtime)"/><path d="M405 299H325" fill="none" stroke="#53756c" stroke-width="2" marker-end="url(#arr-runtime)"/><path d="M180 358V415" fill="none" stroke="#53756c" stroke-width="2" marker-end="url(#arr-runtime)"/><path d="M325 474H405" fill="none" stroke="#53756c" stroke-width="2" marker-end="url(#arr-runtime)"/><path d="M695 474H775" fill="none" stroke="#53756c" stroke-width="2" marker-end="url(#arr-runtime)"/><text x="35" y="579" class="s">시점 고정 하네스 선택 시의 흐름. 현재 정책의 과거 적용 실험이며 의미 정확성과 모델 기억 제거는 인증하지 않음.</text></svg>