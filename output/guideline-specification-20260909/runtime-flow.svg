<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 610" role="img" aria-labelledby="runtime-title"><title id="runtime-title">현재 MCP의 원문·평가·판정 흐름</title><defs><marker id="arr-runtime" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 1L8 5L0 9" fill="none" stroke="#53756c" stroke-width="1.5"/></marker></defs><rect width="1100" height="610" rx="20" fill="#f0f4ef"/><style>text{font-family:Arial,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;fill:#17372e}.t{font-size:21px;font-weight:700}.s{font-size:16px}.n{font-size:13px;fill:#557b6e}</style><text x="35" y="40" class="t">현재 MCP의 원문·평가·판정 흐름</text><rect x="35" y="65" width="290" height="118" rx="12" fill="white" stroke="#acc5b9"/><text x="53" y="90" class="n">01 · REQUEST</text><text x="53" y="120" class="t">회차·기준일 고정</text><text x="53" y="149" class="s">회사 · 회의 · 후보 범위</text><text x="53" y="171" class="s">사후 자료와 대상 회차 결과 제외</text><rect x="405" y="65" width="290" height="118" rx="12" fill="white" stroke="#acc5b9"/><text x="423" y="90" class="n">02 · EVIDENCE</text><text x="423" y="120" class="t">공개 원문 수집</text><text x="423" y="149" class="s">공고 · 사업보고서 이사회 절</text><text x="423" y="171" class="s">지정 5건 + 임원 변동 탐색 5건</text><rect x="775" y="65" width="290" height="118" rx="12" fill="white" stroke="#acc5b9"/><text x="793" y="90" class="n">03 · TASK</text><text x="793" y="120" class="t">평가 과업 반환</text><text x="793" y="149" class="s">원문 발췌 · 정책 · 출력 스키마</text><text x="793" y="171" class="s">대상과 내용에 연결된 task_id</text><rect x="775" y="240" width="290" height="118" rx="12" fill="white" stroke="#acc5b9"/><text x="793" y="265" class="n">04 · CALLER LLM</text><text x="793" y="295" class="t">원문 읽기·평가 제출</text><text x="793" y="324" class="s">선임구분 · 독립성 · 반증</text><text x="793" y="346" class="s">기사 논조 제외 / 사람 미검토</text><rect x="405" y="240" width="290" height="118" rx="12" fill="white" stroke="#acc5b9"/><text x="423" y="265" class="n">05 · VALIDATE</text><text x="423" y="295" class="t">과업·인용 연결 검사</text><text x="423" y="324" class="s">타입 · 현재 과업 · 원문 인용</text><text x="423" y="346" class="s">의미 정확성 인증과는 별개</text><rect x="35" y="240" width="290" height="118" rx="12" fill="white" stroke="#acc5b9"/><text x="53" y="265" class="n">06 · METRICS</text><text x="53" y="295" class="t">수용 평가를 지표로</text><text x="53" y="324" class="s">미수용은 unknown</text><text x="53" y="346" class="s">미공개 관계 세부는 후속 확인</text><rect x="35" y="415" width="290" height="118" rx="12" fill="white" stroke="#acc5b9"/><text x="53" y="440" class="n">07 · RULES</text><text x="53" y="470" class="t">규칙별 상태와 권고</text><text x="53" y="499" class="s">반대 신호 보존 · 긍정 게이트</text><text x="53" y="521" class="s">재직·정지 구간과 회의 수 계산</text><rect x="405" y="415" width="290" height="118" rx="12" fill="white" stroke="#acc5b9"/><text x="423" y="440" class="n">08 · CONSTRAINTS</text><text x="423" y="470" class="t">기존 제약 적용</text><text x="423" y="499" class="s">법령 · 기존 판정 · 표결 관계</text><text x="423" y="521" class="s">부모/자식 안건 · 좌석 제한</text><rect x="775" y="415" width="290" height="118" rx="12" fill="white" stroke="#acc5b9"/><text x="793" y="440" class="n">09 · RESULT</text><text x="793" y="470" class="t">최종 권고와 근거</text><text x="793" y="499" class="s">FOR / AGAINST / REVIEW 등</text><text x="793" y="521" class="s">별도 후보 권고·미확인·검토 표시</text><path d="M325 124H405" fill="none" stroke="#53756c" stroke-width="2" marker-end="url(#arr-runtime)"/><path d="M695 124H775" fill="none" stroke="#53756c" stroke-width="2" marker-end="url(#arr-runtime)"/><path d="M920 183V240" fill="none" stroke="#53756c" stroke-width="2" marker-end="url(#arr-runtime)"/><path d="M775 299H695" fill="none" stroke="#53756c" stroke-width="2" marker-end="url(#arr-runtime)"/><path d="M405 299H325" fill="none" stroke="#53756c" stroke-width="2" marker-end="url(#arr-runtime)"/><path d="M180 358V415" fill="none" stroke="#53756c" stroke-width="2" marker-end="url(#arr-runtime)"/><path d="M325 474H405" fill="none" stroke="#53756c" stroke-width="2" marker-end="url(#arr-runtime)"/><path d="M695 474H775" fill="none" stroke="#53756c" stroke-width="2" marker-end="url(#arr-runtime)"/><text x="35" y="579" class="s">연결 검사 실패 → 평가 거절·미사용. 추가 자료나 정책이 바뀌면 새 과업으로 재평가.</text></svg>