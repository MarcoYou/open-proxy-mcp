<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 760" role="img" aria-labelledby="staged-title"><title id="staged-title">단계별 구조 판단과 QA</title><defs><marker id="staged-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 1L8 5L0 9" fill="none" stroke="#53756c" stroke-width="1.5"/></marker></defs><rect width="720" height="760" rx="18" fill="#f0f4ef"/><g data-stage="1"><rect x="24" y="22" width="672" height="88" rx="12" fill="white" stroke="#acc5b9"/><text x="45" y="56" font-family="sans-serif" font-size="25" fill="#17372e" font-weight="700">01 · 사실 판독</text><text x="45" y="86" font-family="sans-serif" font-size="20" fill="#365c50">설정과 분리한 원문 판독 · 표결 종류 고정</text></g><path d="M360 110V131" stroke="#53756c" fill="none" marker-end="url(#staged-arrow)"/><g data-stage="2"><rect x="24" y="136" width="672" height="88" rx="12" fill="white" stroke="#acc5b9"/><text x="45" y="170" font-family="sans-serif" font-size="25" fill="#17372e" font-weight="700">02 · 기준별 해석</text><text x="45" y="200" font-family="sans-serif" font-size="20" fill="#365c50">고정된 사실 + 현재 정책 · 중요성·반증</text></g><path d="M360 224V245" stroke="#53756c" fill="none" marker-end="url(#staged-arrow)"/><g data-stage="3"><rect x="24" y="250" width="672" height="88" rx="12" fill="white" stroke="#acc5b9"/><text x="45" y="284" font-family="sans-serif" font-size="25" fill="#17372e" font-weight="700">03 · 권고</text><text x="45" y="314" font-family="sans-serif" font-size="20" fill="#365c50">stance·firmness 적용 · 조건·미확인 보존</text></g><path d="M360 338V359" stroke="#53756c" fill="none" marker-end="url(#staged-arrow)"/><g data-stage="4"><rect x="24" y="364" width="672" height="88" rx="12" fill="white" stroke="#acc5b9"/><text x="45" y="398" font-family="sans-serif" font-size="25" fill="#17372e" font-weight="700">04 · 원문 QA</text><text x="45" y="428" font-family="sans-serif" font-size="20" fill="#365c50">주체·기간·인용·정책·숫자·표결 대조</text></g><path d="M360 452V473" stroke="#53756c" fill="none" marker-end="url(#staged-arrow)"/><g data-stage="5"><rect x="24" y="478" width="672" height="88" rx="12" fill="white" stroke="#acc5b9"/><text x="45" y="512" font-family="sans-serif" font-size="25" fill="#17372e" font-weight="700">05 · 실제 MCP 제출</text><text x="45" y="542" font-family="sans-serif" font-size="20" fill="#365c50">지문·인용·의존 관계 검사 · 오류 안건 격리</text></g><path d="M360 566V587" stroke="#53756c" fill="none" marker-end="url(#staged-arrow)"/><g data-stage="6"><rect x="24" y="592" width="672" height="88" rx="12" fill="white" stroke="#acc5b9"/><text x="45" y="626" font-family="sans-serif" font-size="25" fill="#17372e" font-weight="700">06 · 최종 응답</text><text x="45" y="656" font-family="sans-serif" font-size="20" fill="#365c50">찬반·검토 + 처리 상태 · 사람 미검토</text></g><text x="24" y="724" font-family="sans-serif" font-size="17" fill="#365c50">문제가 있는 단계와 그 뒤만 다시 검토 · 실제 투표 전송 없음</text></svg>