<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 610" role="img" aria-labelledby="governance-title"><title id="governance-title">공시 발견 → LLM 거버넌스 검토 → 호출자 증분 조회</title><defs><marker id="arr-governance" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 1L8 5L0 9" fill="none" stroke="#53756c" stroke-width="1.5"/></marker></defs><rect width="1100" height="610" rx="20" fill="#f0f4ef"/><style>text{font-family:Arial,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;fill:#17372e}.t{font-size:21px;font-weight:700}.s{font-size:16px}.n{font-size:13px;fill:#557b6e}</style><text x="35" y="40" class="t">공시 발견 → LLM 거버넌스 검토 → 호출자 증분 조회</text><rect x="35" y="65" width="290" height="118" rx="12" fill="white" stroke="#acc5b9"/><text x="53" y="90" class="n">01 · DISCOVER</text><text x="53" y="120" class="t">읽을 회사 발견</text><text x="53" y="149" class="s">screener · governance 유형</text><text x="53" y="171" class="s">회사 중복 제거 · 최대 30개</text><rect x="405" y="65" width="290" height="118" rx="12" fill="white" stroke="#acc5b9"/><text x="423" y="90" class="n">02 · SOURCE</text><text x="423" y="120" class="t">회사별 원문 과업</text><text x="423" y="149" class="s">공개매수 · 지분 · 소송 · 재편</text><text x="423" y="171" class="s">날짜 · 해시 · 문맥 · 실패 보존</text><rect x="775" y="65" width="290" height="118" rx="12" fill="white" stroke="#acc5b9"/><text x="793" y="90" class="n">03 · CALLER LLM</text><text x="793" y="120" class="t">판독 · 연결 · 반증</text><text x="793" y="149" class="s">행위 · 당사자 · 조건 · 후속 사건</text><text x="793" y="171" class="s">필요한 원문만 다시 펼쳐 읽기</text><rect x="775" y="240" width="290" height="118" rx="12" fill="white" stroke="#acc5b9"/><text x="793" y="265" class="n">04 · ASSESS</text><text x="793" y="295" class="t">구체적 영향 평가</text><text x="793" y="324" class="s">우려 · 반대 근거 · 건너뛴 항목</text><text x="793" y="346" class="s">사건 존재만으로 악재 판정 금지</text><rect x="405" y="240" width="290" height="118" rx="12" fill="white" stroke="#acc5b9"/><text x="423" y="265" class="n">05 · VALIDATE</text><text x="423" y="295" class="t">과업 · 인용 · 계약 검사</text><text x="423" y="324" class="s">현재 자료와 평가를 연결</text><text x="423" y="346" class="s">잘못된 제출은 해당 회사만 제외</text><rect x="35" y="240" width="290" height="118" rx="12" fill="white" stroke="#acc5b9"/><text x="53" y="265" class="n">06 · TRIAGE</text><text x="53" y="295" class="t">검토 우선순위</text><text x="53" y="324" class="s">사용자 중요도에 따라 분기</text><text x="53" y="346" class="s">읽은 범위 · 사람 미검토 표시</text><rect x="35" y="415" width="290" height="118" rx="12" fill="white" stroke="#acc5b9"/><text x="53" y="440" class="n">07 · CHECKPOINT</text><text x="53" y="470" class="t">본 접수번호 반환</text><text x="53" y="499" class="s">호출자가 보존해 다음에 전달</text><text x="53" y="521" class="s">서버에 평가 결과 저장 없음</text><rect x="405" y="415" width="290" height="118" rx="12" fill="white" stroke="#acc5b9"/><text x="423" y="440" class="n">08 · NEXT CALL</text><text x="423" y="470" class="t">원할 때 새 공시 조회</text><text x="423" y="499" class="s">since · known_receipts 적용</text><text x="423" y="521" class="s">예약 실행을 만들지 않음</text><rect x="775" y="415" width="290" height="118" rx="12" fill="white" stroke="#acc5b9"/><text x="793" y="440" class="n">09 · REASSESS</text><text x="793" y="470" class="t">변경 원문을 다시 판단</text><text x="793" y="499" class="s">정정 · 결과 · 철회 내용 대조</text><text x="793" y="521" class="s">새 원문 · 설정이면 새 과업</text><path d="M325 124H405" fill="none" stroke="#53756c" stroke-width="2" marker-end="url(#arr-governance)"/><path d="M695 124H775" fill="none" stroke="#53756c" stroke-width="2" marker-end="url(#arr-governance)"/><path d="M920 183V240" fill="none" stroke="#53756c" stroke-width="2" marker-end="url(#arr-governance)"/><path d="M775 299H695" fill="none" stroke="#53756c" stroke-width="2" marker-end="url(#arr-governance)"/><path d="M405 299H325" fill="none" stroke="#53756c" stroke-width="2" marker-end="url(#arr-governance)"/><path d="M180 358V415" fill="none" stroke="#53756c" stroke-width="2" marker-end="url(#arr-governance)"/><path d="M325 474H405" fill="none" stroke="#53756c" stroke-width="2" marker-end="url(#arr-governance)"/><path d="M695 474H775" fill="none" stroke="#53756c" stroke-width="2" marker-end="url(#arr-governance)"/><text x="35" y="579" class="s">기업 거버넌스 검토와 안건별 의결권 자문은 별도 과업. 실제 투표 전송·영구 사건 그래프는 범위 밖.</text></svg>