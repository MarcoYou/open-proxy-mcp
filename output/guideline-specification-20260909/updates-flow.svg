<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 410" role="img" aria-labelledby="updates-title"><title id="updates-title">자료와 정책의 갱신 경로 — 목표 설계</title><defs><marker id="arr-updates" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 1L8 5L0 9" fill="none" stroke="#53756c" stroke-width="1.5"/></marker></defs><rect width="1100" height="410" rx="20" fill="#f0f4ef"/><style>text{font-family:Arial,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;fill:#17372e}.t{font-size:21px;font-weight:700}.s{font-size:16px}.n{font-size:13px;fill:#557b6e}</style><text x="35" y="40" class="t">자료와 정책의 갱신 경로 — 목표 설계</text><rect x="35" y="75" width="290" height="118" rx="12" fill="white" stroke="#acc5b9" stroke-dasharray="6 4"/><text x="53" y="100" class="n">DATA CHANGE</text><text x="53" y="130" class="t">공시·원문 변경</text><text x="53" y="159" class="s">신규 · 정정 · 철회</text><text x="53" y="181" class="s">시점과 원문 계보 확인</text><rect x="405" y="75" width="290" height="118" rx="12" fill="white" stroke="#acc5b9" stroke-dasharray="6 4"/><text x="423" y="100" class="n">IMPACT</text><text x="423" y="130" class="t">영향받는 과업 선택</text><text x="423" y="159" class="s">원천 → 사실 → 규칙 연결</text><text x="423" y="181" class="s">같은 정책으로 필요한 부분 재평가</text><rect x="775" y="75" width="290" height="118" rx="12" fill="white" stroke="#acc5b9" stroke-dasharray="6 4"/><text x="793" y="100" class="n">NEW RUN</text><text x="793" y="130" class="t">새 분석 결과</text><text x="793" y="159" class="s">근거·정책 버전 명시</text><text x="793" y="181" class="s">과거 기준일에 미래 자료 혼입 금지</text><rect x="35" y="240" width="290" height="118" rx="12" fill="white" stroke="#acc5b9" stroke-dasharray="6 4"/><text x="53" y="265" class="n">POLICY CHANGE</text><text x="53" y="295" class="t">정책 의미 변경</text><text x="53" y="324" class="s">기관 정책 · 법령 · 고객 설정</text><text x="53" y="346" class="s">변경 후보 작성</text><rect x="405" y="240" width="290" height="118" rx="12" fill="white" stroke="#acc5b9" stroke-dasharray="6 4"/><text x="423" y="265" class="n">REVIEW</text><text x="423" y="295" class="t">컴파일·영향 평가·승인</text><text x="423" y="324" class="s">타입 · 단위 · 권한 · 충돌</text><text x="423" y="346" class="s">승인된 범위만 활성화</text><rect x="775" y="240" width="290" height="118" rx="12" fill="white" stroke="#acc5b9" stroke-dasharray="6 4"/><text x="793" y="265" class="n">ACTIVATE / RESTORE</text><text x="793" y="295" class="t">새 버전 활성화·복구</text><text x="793" y="324" class="s">불변 버전과 활성 버전 분리</text><text x="793" y="346" class="s">오류 시 검증된 이전 버전 사용</text><path d="M325 134H405" fill="none" stroke="#53756c" stroke-width="2" marker-end="url(#arr-updates)"/><path d="M695 134H775" fill="none" stroke="#53756c" stroke-width="2" marker-end="url(#arr-updates)"/><path d="M325 299H405" fill="none" stroke="#53756c" stroke-width="2" marker-end="url(#arr-updates)"/><path d="M695 299H775" fill="none" stroke="#53756c" stroke-width="2" marker-end="url(#arr-updates)"/><text x="35" y="390" class="s">점선은 미구현 목표 설계. 현재는 재호출 시 과업의 변경 여부를 대조한다.</text></svg>