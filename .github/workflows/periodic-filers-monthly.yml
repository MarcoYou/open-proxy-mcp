# 정기보고서 제출 법인 명부 월간 갱신 — scripts/refresh_periodic_filers.py (cron)
#
# 260823 사고의 재발 방지. 명부는 처음 만들 때 **183 API콜(약 3분)** 이 든다. 그걸 요청
# 경로에서 돌다 프록시 타임아웃에 걸려 502 가 났고, 끊기니 저장을 못 해 다음 요청도 같은
# 3분을 반복하는 **영영 안 낫는 고리**가 됐다(fix: 2c228105 가 백그라운드로 옮겼다).
#
# 백그라운드로 502 는 막았지만 **배포 직후 명부가 비는 창**은 남는다 — 그동안 비상장
# 금융사 55곳이 안 열리고 동명 법인이 AMBIGUOUS 로 남는다. 동봉본이 있으면 그 창이 없다.
#
# 월 1회인 이유: 명부는 **분기 공시 시즌에만 늘어나는 느린 데이터**다. 주간으로 모으면
#   같은 값이 4배로 쌓이기만 하고 DART 콜만 4배가 된다.
#
# 콜: ~183/월. 하드룰(분당 910 · 일 40,000)의 0.5%.

name: periodic-filers-monthly

on:
  schedule:
    # 매월 2일 03:20 UTC = KST 12:20. 1일은 wics-monthly 가 쓰므로 겹치지 않게 둔다.
    - cron: "20 3 2 * *"
  workflow_dispatch: {}

permissions:
  contents: write  # 동봉본 커밋백
  actions: write   # 커밋백 뒤 배포를 직접 부르기 위해 (260901)

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync deps
        run: uv sync

      - name: 명부 수집 (DART ~183콜)
        # 무결성: 2,000건 미만이면 **아무것도 쓰지 않고 실패**한다. 덜 모인 명부를 쓰면
        #   거기 없는 회사가 조용히 닫힌다 — 전부-아니면-전무가 맞다.
        env:
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
        run: uv run python scripts/refresh_periodic_filers.py

      - name: 동봉본 검증 — 런타임이 실제로 읽나
        # 「파일이 생겼다」가 아니라 **런타임 로더가 읽어내는가**로 확인한다.
        #   경로·패키지 배선이 어긋나면 파일은 있는데 조용히 None 이 된다(260814 교훈).
        run: |
          uv run python - <<'PY'
          from open_proxy_mcp.dart.client import _filers_bundled_load, _FILERS_MIN_EXPECTED
          got = _filers_bundled_load()
          if got is None:
              raise SystemExit("::error::동봉본을 런타임이 못 읽는다 — 패키지 배선 확인")
          print(f"런타임 로더 OK: {len(got):,}사 (문턱 {_FILERS_MIN_EXPECTED:,})")
          # 알려진 비상장 금융사가 들어 있나 — 명부의 목적이 이것이다
          import json
          from importlib.resources import files
          raw = json.loads((files("open_proxy_mcp.data.dart") / "periodic_filers.json").read_text("utf-8"))
          print(f"기준일: {raw['meta']['refreshed_at']} · 최근 접수 {max(raw['filers'].values())}")
          PY

      - name: 커밋 (실질 변경 시)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          F=open_proxy_mcp/data/dart/periodic_filers.json
          if git diff --quiet -- "$F"; then
            echo "변경 없음 — 커밋 생략"
          elif [ "$(git diff -U0 -- "$F" | grep -c '^[+-][^+-]')" -le 2 ]; then
            echo "refreshed_at 만 변경 — 되돌리고 커밋 생략"
            git checkout -- "$F"
          else
            N=$(python3 -c "import json;print(json.load(open('$F'))['meta']['count'])")
            git add "$F"
            git commit \
              -m "chore(filers): 정기보고서 제출 법인 명부 갱신 — ${N}사" \
              -m "배포 직후 명부가 비는 창을 없앤다(런타임 수집은 폴백)." \
              -m "Co-Authored-By: Claude Opus 5 <noreply@anthropic.com>"
            git push
            # 데이터 자동 커밋은 `on: push` 를 트리거하지 않는다 — GITHUB_TOKEN 으로 민 푸시는
            # 워크플로를 깨우지 않는 것이 GitHub 기본 동작이다. 그래서 커밋은 main 에 올라가는데
            # **live 는 옛 데이터인 채로 남는다**(260901 실측: 법령 8/31 커밋이 배포되지 않아
            # live 2,725조 vs main 2,734조). 커밋했을 때만 배포를 직접 부른다.
            gh workflow run deploy.yml --ref main \
              && echo "🚀 배포 요청함" || echo "🔴 배포 요청 실패 — 사람이 밀어야 한다"
            echo "✅ 커밋·푸시 완료 (${N}사)"
          fi
