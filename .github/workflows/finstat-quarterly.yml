# 분기 재무 수집 — scripts/market_fund_quarterly.py --fetch (cron)
#
# 260823 신설. **`--fetch` 를 도는 cron 이 없었다.** `market-val-weekly` 는 `--derive`(0콜 파생)만
# 돌리고 실제 수집은 수동이었다. 그 결과 FY2026 반기(Q2)가 법정기한 8/14 를 넘기고도 **2,540사
# 전부 미수집**이었고, 8/14 이후 배수의 TTM·MRQ 가 1분기 기준으로 굳어 있었다.
#
# 겉으로는 멀쩡해 보였다 — 배수가 계속 나오고 krx_weekly 는 매일 갱신되니까. 오늘 정리한
# 법령 corpus·수정계수·주식수 원장·해석주의 딱지와 **완전히 같은 형태**다:
#   돌지 않는 코드는 깨져도 안 보인다.
#
# 언제 도나: 분기 공시 마감(1Q 5/15 · 반기 8/14 · 3Q 11/14) 직후부터 한 달간 매일.
#   전 종목이 마감일에 한꺼번에 내지 않고 며칠에 걸쳐 내므로, 하루만 돌면 늦게 낸 회사를 놓친다.
#   스크립트가 **이미 있는 분기는 건너뛰고 실패분만 재시도**하므로 매일 돌아도 낭비가 없다
#   (`done` 집합에서 `err:` 만 제외 → 일일한도에 걸렸던 것도 다음날 자동 복구).
#   `_disclosed()` 가 미공시 분기를 스스로 거르니 시즌 밖 실행도 안전하다.
#
# 261018: **자료 없음(nodata)도 마감 뒤 400일 동안 매번 다시 본다**(스크립트 `NODATA_RETRY_DAYS`).
#   종전엔 nodata 를 완료로 봐서, 마감 직후 첫 실행 때 아직 안 낸 회사가 나중에 내도 영영 비어 있었다
#   (10-18 실측: 2026 반기 칸 nodata 63종목 중 24종목이 마감 뒤 8/24~10/07 에 냈다 — 외국 상장사 10 포함).
#   창(마감 뒤 한 달) 밖에도 늦게 내는 회사가 있어(10/07 제출 사례) 주 1회 남은 것만 다시 본다 —
#   남은 nodata 수백 건 × 1~2콜이라 몇 분이다. 창 안의 매일 실행과 겹치는 날은 아래 concurrency 가 줄 세운다.
#
# 261018(결산월): 칸의 실제 기간 말·공시 마감을 회사 결산월(dart_fundamentals.acc_mt)로 센다(open_proxy_mcp/services/report_calendar.py).
#   그래서 이 일정이 분기 수집 앞에 세 단계를 더 돈다 —
#   ① 결산월 채우기·고치기(--acc-mt: 최근 100일 정기공시 목록의 사업보고서 기준월 · ~90콜, 상장 첫해 종목만 회사 개황 1콜씩)
#   ② 연간 재무(market_val_series --fetch): 종목마다 결산월로 「지금 나와 있어야 할 최신 사업보고서」까지 받는다. 종전엔 이 수집이
#      일정에 없었고(수동) 상한이 12월 결산 규칙이라 3월 결산 회사의 2026.03 사업보고서(6월 제출)가 2027년 4월에야 들어왔다.
#      12월 결산은 4월 첫 주에 한꺼번에(~2,600사), 나머지 결산월은 공시 시점이 지난 첫 월요일에 몇 사씩.
#   ③ Q4 seed(--seed): 새 연간 행을 분기 표 사업보고서 칸으로 옮긴다(값이 같은 행은 다시 쓰지 않는다 — DART 0콜).
#
# 261019(환율): 외화 보고사(USD·CNY·JPY·GBP) 재무를 원화로 바꿀 때 환율 표(ecos_fx_rate)에 그 날짜가 없으면 한국은행 ECOS 를 묻는다.
#   이 일정엔 ECOS_API_KEY 가 없어 야후 대체값으로 환산했고, 그 값이 환율 표에 영구로 굳었다(10-19 운영 6행 — JPY·GBP, ECOS 와 −0.08~+0.62%).
#   이제 대체값은 표에 넣지 않고(open_proxy_mcp/dart/fx.py) 쓴 행을 `::warning::[환율]` 로 남긴다. 저장소 비밀값 ECOS_API_KEY 를 두면
#   (서버와 같은 키) 처음부터 ECOS 값으로 환산된다 — 비밀값이 없으면 빈 값이라 동작은 위와 같다.
#
# 콜: 첫날 ~2,600(전 종목 × 1분기). 이후엔 남은 것만이라 급감.
#   동시성 2 · 0.45s sleep ≈ 133콜/분 (하드룰 910/분의 15%).

name: finstat-quarterly

on:
  schedule:
    # 분기 마감 다음날부터 한 달간 매일 20:40 UTC = KST 05:40(장 시작 전).
    #   5/16~6/15 · 8/15~9/14 · 11/15~12/14
    - cron: "40 20 16-31 5 *"
    - cron: "40 20 1-15 6 *"
    - cron: "40 20 15-31 8 *"
    - cron: "40 20 1-14 9 *"
    - cron: "40 20 15-30 11 *"
    - cron: "40 20 1-14 12 *"
    # 늦게 낸 회사 재확인 — 매주 일요일 20:40 UTC = 월요일 05:40 KST (261018)
    - cron: "40 20 * * 0"
  workflow_dispatch:
    inputs:
      years:
        description: "콤마구분 연도 (비우면 2019~현재 전체 — 재개라 이미 있는 건 건너뜀)"
        required: false

permissions:
  contents: read

# 같은 날 두 일정(창 안 매일 + 주 1회)이 겹치면 차례로 — 두 번째는 첫 번째가 남긴 것만 본다.
concurrency:
  group: finstat-quarterly
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.13"  # 260909 CI 실패 방지 — 정확한 버전은 버전 목록 조회를 건너뛴다. 올릴 때 9개 워크플로 함께

      - name: Sync deps
        run: uv sync

      - name: 수집 전 구멍 확인
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          uv run python - <<'PY'
          import os, psycopg
          from datetime import date
          DEAD = {1: (5, 15), 2: (8, 14), 3: (11, 14)}
          fy = date.today().year
          with psycopg.connect(os.environ["DATABASE_URL"], connect_timeout=20) as c:
              base = c.execute("SELECT count(*) FROM dart_fundamentals WHERE fetched='ok'").fetchone()[0]
              for q, (mo, dy) in DEAD.items():
                  if date.today() < date(fy, mo, dy):
                      continue
                  n = c.execute("SELECT count(*) FROM dart_finstat_q "
                                "WHERE fy=%s AND quarter=%s AND fetched='ok'", (fy, q)).fetchone()[0]
                  print(f"FY{fy} Q{q}: {n:,}/{base:,} ({n/base:.0%})")
          PY

      - name: 결산월 채우기·고치기 (DART 목록 ~90콜)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
        run: uv run python scripts/market_fund_quarterly.py --acc-mt

      # 261019: 아래 단계들은 앞 단계가 실패해도 돈다(`!cancelled()` — 잡은 실패로 남아 보인다). 위 결산월 단계는 DART 목록 오류(점검 800·5xx 등)에
      #   예외로 멈추는데, 기본 규칙(앞 단계 성공일 때만)이면 그 한 번이 이 일정의 본래 일인 분기 수집·파생까지 건너뛰게 했다.
      #   각 단계는 저장된 것만 읽고 다시 돌아도 같은 결과라(재개·값이 같은 행은 다시 쓰지 않음) 앞 단계가 반쯤 끝나도 안전하다.
      - name: 연간 재무 수집 — 결산월별 최신 사업보고서 (DART)
        # 이미 받은 사업연도는 건너뛴다(자료 없음은 공시 시점 뒤 400일 동안 다시 본다). 받을 것이 없으면 0콜.
        if: ${{ !cancelled() }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}     # 261019: 외화 보고사 환산 — 아래 머리말 참고
        run: uv run python scripts/market_val_series.py --fetch

      - name: Q4 seed — 새 연간 행을 분기 표 사업보고서 칸으로 (DART 0콜)
        if: ${{ !cancelled() }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run python scripts/market_fund_quarterly.py --seed

      - name: 분기 재무 수집 (DART)
        if: ${{ !cancelled() }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}     # 261019: 외화 보고사 환산 — 아래 머리말 참고
        run: |
          if [ -n "${{ inputs.years }}" ]; then
            uv run python scripts/market_fund_quarterly.py --fetch --years "${{ inputs.years }}"
          else
            uv run python scripts/market_fund_quarterly.py --fetch
          fi

      - name: 결산기 칸 — 반기·분기 결산 회사(리츠 등) (DART 목록 종목당 1콜 + 새 보고서 연도만)
        # 261020(p1e): 결산기마다 사업보고서를 내는 회사의 결산기 사실값을 12개월 결산 회사와 같은 꼴(사업연도 누적)로 정정 칸에 — 아래 파생이 읽는다.
        #   새 보고서가 없으면 종목당 목록 1콜뿐이다(open_proxy_mcp/services/period_cells.py).
        if: ${{ !cancelled() }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
        run: uv run python scripts/market_fund_quarterly.py --period-cells

      - name: 파생 갱신 + 결과 확인
        # 「성공」이 아니라 **산출물 변화**로 확인한다. 수집이 0건이어도 스크립트는 정상 종료한다.
        if: ${{ !cancelled() }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          uv run python scripts/market_fund_quarterly.py --derive
          uv run python - <<'PY'
          import os, psycopg
          from datetime import date
          DEAD = {1: (5, 15), 2: (8, 14), 3: (11, 14)}
          fy = date.today().year
          with psycopg.connect(os.environ["DATABASE_URL"], connect_timeout=20) as c:
              base = c.execute("SELECT count(*) FROM dart_fundamentals WHERE fetched='ok'").fetchone()[0]
              worst = 1.0
              for q, (mo, dy) in DEAD.items():
                  if date.today() < date(fy, mo, dy):
                      continue
                  n = c.execute("SELECT count(*) FROM dart_finstat_q "
                                "WHERE fy=%s AND quarter=%s AND fetched='ok'", (fy, q)).fetchone()[0]
                  print(f"FY{fy} Q{q}: {n:,}/{base:,} ({n/base:.0%})")
                  worst = min(worst, n / base if base else 0)
              # 마감 한 달이 지났는데도 절반을 못 채우면 뭔가 막힌 것이다(키 한도·API 장애).
              if worst < 0.5:
                  print(f"::warning::공시완료 분기 중 최저 커버리지 {worst:.0%} — 수집이 막혔는지 확인")
          PY
