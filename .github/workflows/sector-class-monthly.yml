# 업종분류 월간 수집 — scripts/refresh_sector_class.py (cron)
#
# 260823 신설. 업종분류(대분류 10 / 하위업종 28)는 우리 KSIC 하이브리드와 **다른 축**의
# 업종분류다. 벤더·리서치가 쓰는 기준이라 섹터 비교에서 KSIC 와 나란히 놓을 값이 있다.
#
# ★ 과거 관측은 못 만든다. 분류 공급처는 조회 시점의 구성종목만 주고 우리는 2026-08 부터 모았다.
#   그래서 두 갈래를 함께 쓴다:
#     · **관측** — 이 cron 이 월 1회 쌓는다. 오늘부터의 진짜 시점 분류다.
#     · **소급** — 과거 79개 월말 집계는 현재 분류를 적용한 것이다(사용자 결정, 260823).
#       벤더도 흔히 쓰는 방식이지만 「작년에 IT 가 아니던 회사를 작년 IT 에 넣는」 편향이 있다.
#       그래서 산출물이 `sector_asof` 로 **언제 관측한 분류인지** 밝힌다. 관측이 쌓일수록
#       소급 구간이 뒤로 밀린다.
#
# 월 1회인 이유: 업종분류는 분기·연 단위로 바뀌는 느린 데이터다. 주간으로 모으면 같은 값이
#   4배로 쌓이기만 한다. 월말 기준으로 12장/년이면 시계열로 충분하다.
#
# 콜: 분류 트리 1 + 하위업종 28 ≈ 29콜/월. 무자료 탐침은 최대 10콜 추가(14일 소급).
# 모든 요청은 프로세스 공통 웹 속도제한을 따르며, 상류 오류에는 날짜를 바꿔 재시도하지 않는다. DART·KRX 0콜.

name: sector-class-monthly

on:
  schedule:
    # 매월 1일 02:30 UTC = KST 11:30. 스크립트 기본값이 「직전 금요일」이라
    # 주말/명시적 무자료인 경우에만 그 이하 최대 14일 전까지 검증된 유효일을 찾는다.
    - cron: "30 2 1 * *"
  workflow_dispatch:
    inputs:
      date:
        description: "정확한 기준일 YYYYMMDD (비우면 직전 금요일 이하 최대 14일 소급)"
        required: false

permissions:
  contents: write  # 정적 맵(JSON) 커밋백
  actions: write   # 커밋백 뒤 배포를 직접 부르기 위해 (260901)

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.13"  # 260909 CI 실패 방지 — 정확한 버전은 버전 목록 조회를 건너뛴다. 올릴 때 9개 워크플로 함께

      - name: Sync deps
        run: uv sync

      - name: 업종분류 수집 — 정적 맵 + 분류 스냅샷 적재
        # 무결성 규칙(스크립트 내장): 대분류 10 미만 / 하위업종 20 미만 / 종목 1,000 미만이거나
        #   한 종목이 둘 이상 하위업종에 나타나면 **아무것도 쓰지 않고 중단**한다.
        #   모든 하위업종의 응답일이 선택한 조회일과 같아야 한다. 날짜 누락·혼합·부분 무자료도 중단한다.
        #   불완전 응답을 절반만 반영하면 섹터 집계가 조용히 틀어지므로 전부-아니면-전무가 맞다.
        # 261018: 응답은 업종 **지수 구성종목**이라 상장 종목이 편입 요건에서 빠지면 응답에서도 빠진다(분류는 그대로).
        #   DB 적재는 관측 행에 더해 구성종목에서만 빠진 상장 종목(직전 분류)과 우선주(보통주 분류)를 출처 칸과 함께 잇는다.
        #   정적 맵(JSON)은 관측만 담는다. 규칙은 스크립트 머리말 「구성종목 ≠ 분류 대상」.
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            uv run python scripts/refresh_sector_class.py --date "${{ inputs.date }}"
          else
            uv run python scripts/refresh_sector_class.py
          fi

      - name: 적재 확인 — 시점이 늘었나
        # 「성공」이 아니라 **산출물 변화**로 확인한다(260823 법령 배치 교훈: 상류가 죽어도 초록불).
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          uv run python - <<'PY'
          import os, psycopg
          with psycopg.connect(os.environ["DATABASE_URL"], connect_timeout=20) as c:
              rows, snaps, latest = c.execute(
                  "SELECT count(*), count(DISTINCT snap_dd), max(snap_dd) FROM wise_sector").fetchone()
              print(f"분류 스냅샷 {rows:,}행 / {snaps}개 시점 · 최신 {latest}")
              # 261018: 관측(공급처 구성종목) + 파생(구성종목에서만 빠진 상장 종목의 직전 분류 · 우선주의 보통주 분류)을
              #   출처별로 보인다. 완전성 기준(1,000)은 관측 행에만 건다 — 파생 행이 불완전 수집을 가리면 안 된다.
              by = dict(c.execute("SELECT src, count(*) FROM wise_sector WHERE snap_dd=%s GROUP BY 1",
                                  (latest,)).fetchall())
              n, obs = sum(by.values()), by.get("wise", 0)
              print(f"최신 시점 출처별: 관측 {obs:,} · 이어 쓰기 {by.get('carry', 0):,} · 우선주 {by.get('pref', 0):,}")
              if obs < 1000:
                  raise SystemExit(f"::error::최신 시점 관측 종목이 {obs}개 — 1,000 미만이면 불완전 수집")
              # 시세와 조인되는지(섹터 집계가 실제로 되는 상태인가).
              # 261018(재설계 5-1 쓰는 쪽): krx_weekly 는 닫힌 주(주마다 마지막 거래일)만 담고, 최근 7거래일은 일별 저장분 krx_daily 에 있다.
              #   분류 기준일(보통 월말 거래일)은 주중일 때가 많아 krx_weekly 정확일자로는 0건이 정상이다 — 「기준일 이하 가장 늦은 시세일」로
              #   두 표를 함께 보고 조인한다(집계 스크립트도 같은 날 이하 최신 시세를 쓴다).
              pd = c.execute("""SELECT max(d) FROM (SELECT max(price_dd) d FROM krx_weekly WHERE price_dd <= %s
                                UNION ALL SELECT max(trd_dd) FROM krx_daily WHERE trd_dd <= %s) x""",
                             (latest, latest)).fetchone()[0]
              j = c.execute("""SELECT count(*) FROM wise_sector w
                               JOIN (SELECT ticker FROM krx_daily WHERE trd_dd=%s
                                     UNION SELECT ticker FROM krx_weekly WHERE price_dd=%s) k ON k.ticker=w.ticker
                               WHERE w.snap_dd=%s""", (pd, pd, latest)).fetchone()[0]
              print(f"시세 조인(분류 기준일 {latest} 이하 최신 시세일 {pd}): {j:,}/{n:,}")
              if j < n * 0.9:
                  print(f"::warning::분류 종목 중 {pd} 시세와 맞는 종목이 {j:,}/{n:,} — 시세 저장분(krx_daily·krx_weekly) 확인")
          PY

      - name: 업종분류 기준 시장·섹터 집계 (DART·KRX 0콜)
        # 분류만 모아두면 쓸 수 없다 — krx_weekly × dart_finstat 와 합쳐 배수·시총을 낸다.
        #   계산은 KSIC 백필과 **같은 함수**(_pit_fy·_ttm_ni·_mrq_eq)를 재사용하고
        #   갈아끼우는 것은 섹터 버킷 하나뿐이다.
        #   과거 월말은 소급(현재 분류를 과거에 적용) — 산출물이 sector_asof 로 그 사실을 남긴다.
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run python scripts/sector_val_backfill.py

      - name: 정적 맵 커밋 (실질 변경 시)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # refreshedAt 만 바뀐 건 무시 — 분류가 실제로 바뀐 경우에만 커밋한다.
          if git diff --quiet -- open_proxy_mcp/data/sector_class/class_map.json; then
            echo "변경 없음 — 커밋 생략"
          elif [ "$(git diff -U0 -- open_proxy_mcp/data/sector_class/class_map.json | grep -c '^[+-][^+-]')" -le 2 ]; then
            echo "refreshedAt 만 변경 — 되돌리고 커밋 생략"
            git checkout -- open_proxy_mcp/data/sector_class/class_map.json
          else
            AS_OF=$(python3 -c "import json;print(json.load(open('open_proxy_mcp/data/sector_class/class_map.json'))['meta']['asOf'])")
            git add open_proxy_mcp/data/sector_class/class_map.json
            git commit \
              -m "chore(sector-class): 월간 업종분류 갱신 — ${AS_OF} 기준" \
              -m "업종 대분류 10 / 중분류 28. DART·KRX 0콜." \
              -m "Co-Authored-By: Claude Opus 5 <noreply@anthropic.com>"
            git push
            # 데이터 자동 커밋은 `on: push` 를 트리거하지 않는다 — GITHUB_TOKEN 으로 민 푸시는
            # 워크플로를 깨우지 않는 것이 GitHub 기본 동작이다. 그래서 커밋은 main 에 올라가는데
            # **live 는 옛 데이터인 채로 남는다**(260901 실측: 법령 8/31 커밋이 배포되지 않아
            # live 2,725조 vs main 2,734조). 커밋했을 때만 배포를 직접 부른다.
            gh workflow run deploy.yml --ref main \
              && echo "🚀 배포 요청함" || echo "🔴 배포 요청 실패 — 사람이 밀어야 한다"
            echo "✅ 커밋·푸시 완료 (${AS_OF})"
          fi
