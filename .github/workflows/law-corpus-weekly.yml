# 주간 법령 corpus 자동 재복사 — scripts/sync_law_corpus.py (cron)
#
# 설계(260713): 원문 소스 legalize-kr(github.com/legalize-kr/legalize-kr)은 국가법령정보센터를 따라
# **매일** 개정을 반영하는 살아있는 창고. OPM이 쓰는 corpus는 그 스냅샷 사본이라 자동으로 안 따라감.
# 이 배치가 매주 최신 원문을 다시 복사 + 조 단위 색인 재생성 → 4개 법(상법·자본시장법·공정거래법·
# 외부감사법, 각 법률+시행령) 안의 **개정·삭제·신설 조문은 자동 반영**. 새 '법' 추가만 수동(TARGETS).
#
# DART 호출 0 · 외부 secrets 0 (legalize-kr public repo). 안전한 순수 재복사 배치.
# 실질 변경(조문·색인)이 있을 때만 커밋 — manifest의 synced_at 타임스탬프만 바뀐 건 커밋 안 함.

name: law-corpus-weekly

on:
  schedule:
    # 매주 월요일 04:30 UTC = KST 13:30. 주 시작에 지난주 개정분을 반영.
    - cron: "30 4 * * 1"
  workflow_dispatch: {}  # 수동 실행

permissions:
  contents: write  # 변경분 커밋백

jobs:
  resync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync deps
        run: uv sync

      - name: Clone legalize-kr (원문 소스, public)
        # 260814: 종전에는 포크(MarcoYou/legalize-kr)를 봤는데 그 포크가 2026-07-02 에
        #   멈춰 있었다. cron 은 매주 정상 성공했고 「변경 없음」이 계속 찍혔지만,
        #   **원본은 그 사이에도 갱신되고 있었다**(8-11 기준 자본시장법·공정거래법 개정).
        #   6주간 corpus 가 40일 묵은 채로 서빙됐고 아무 신호도 없었다 — 상류가 죽어도
        #   배치는 초록불이라는 형태다. 살아있는 원본을 직접 본다.
        run: git clone --depth 1 https://github.com/legalize-kr/legalize-kr.git /tmp/legalize-kr

      - name: 원본 최신성 확인 — **커밋 날짜가 아니라 법령 공포일로 본다**
        # 260814: 처음엔 `git log -1 --format=%cs` 로 쟀는데 **신호가 반대로 나왔다.**
        #   legalize-kr 원본은 히스토리를 다시 쓰는 방식이라 최신 커밋일이 2026-02-10 인데
        #   내용은 8-04 공포분까지 들어 있고, 멈춰 있던 포크는 커밋일이 7-02 로 더 최신인데
        #   내용은 5-12 공포분에서 멎어 있었다. **커밋 날짜는 내용 최신성의 대리 지표가 못 된다.**
        #   우리가 실제로 쓰는 4법의 `공포일자` 를 직접 읽는다.
        run: |
          DATES=""
          for L in 상법 자본시장과금융투자업에관한법률 독점규제및공정거래에관한법률 주식회사등의외부감사에관한법률; do
            D=$(sed -n 's/^공포일자:[[:space:]]*\([0-9-]*\).*/\1/p' "/tmp/legalize-kr/kr/$L/법률.md" | head -1)
            echo "  $L 공포일자: ${D:-읽기실패}"
            [ -n "$D" ] && DATES="$DATES$D\n"
          done
          NEWEST=$(printf "$DATES" | sort -r | head -1)
          if [ -z "$NEWEST" ]; then
            echo "::error::4법의 공포일자를 하나도 못 읽었다 — 소스 구조가 바뀌었는지 확인"
            exit 1
          fi
          AGE=$(( ( $(date +%s) - $(date -d "$NEWEST" +%s) ) / 86400 ))
          echo "원문 소스의 최신 공포일: $NEWEST (${AGE}일 전)"
          if [ "$AGE" -gt 120 ]; then
            echo "::warning::4법 중 가장 최근 공포가 ${AGE}일 전($NEWEST) — 소스가 멈췄는지 확인"
          fi

      - name: Re-sync law corpus (DART 0콜)
        run: uv run python scripts/sync_law_corpus.py --corpus /tmp/legalize-kr --strict

      - name: SSOT 대조 — 손으로 관리하는 40룰·조항대장이 원문과 맞나
        # 260814 신설. corpus 만 갱신하고 규칙은 손으로 관리하므로, 원문이 바뀌었는데
        # 규칙이 그대로면 **판정이 낡은 법으로 나간다.** 조문번호·시행일이 원문과
        # 어긋나면 여기서 멈춘다(--strict). 자동 생성이 불가능한 부분의 안전망이다.
        run: uv run python scripts/verify_law_against_corpus.py --corpus /tmp/legalize-kr --strict

      - name: Regression — spot_law_lookup (원문 정합·미시행 유보·폴백)
        run: uv run python scripts/spot_law_lookup.py

      - name: Commit if corpus 실질 변경
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # synced_at 타임스탬프만 바뀐 _manifest.json은 무시 — 조문(.md)·색인(law_index.json) 변경만 트리거
          CHANGED=$(git status --porcelain wiki/rules/laws/corpus/ | grep -v '_manifest.json' || true)
          if [ -n "$CHANGED" ]; then
            SRC_DATE=$(git -C /tmp/legalize-kr log -1 --format=%cs)
            git add wiki/rules/laws/corpus/
            git commit \
              -m "chore(law_corpus): 주간 자동 재복사 — legalize-kr ${SRC_DATE} 기준 반영" \
              -m "개정·삭제·신설 조문 자동 반영. scripts/sync_law_corpus.py (DART 0콜)." \
              -m "Co-Authored-By: Claude Opus 5 <noreply@anthropic.com>"
            git push
            echo "✅ 커밋·푸시 완료 (원문 ${SRC_DATE} 기준)"
          else
            # synced_at만 바뀐 manifest는 되돌려 불필요 커밋 방지
            git checkout -- wiki/rules/laws/corpus/_manifest.json 2>/dev/null || true
            echo "실질 변경 없음 — 커밋 생략"
          fi
