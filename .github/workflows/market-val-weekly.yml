# 주간 밸류에이션 스냅샷 배치 — scripts/market_val_weekly.py (cron)
#
# 설계(260705): 매일 수집(전일 종가) → 같은 ISO주 슬롯에 수렴 → 주 마지막 거래일만 영구 보존.
# 배치가 멱등·수렴형이라 매일 돌려도 주당 1스냅샷(무료티어 보호). KRX 4콜/일 (일 10,000 한도 대비 무해).
# 갱신 대상: krx_weekly(시세) · firm_valuation_snapshot(종목별 PER/PBR) · mkt_val_history(시장·섹터,
#   260706 병합으로 섹터도 이 테이블 sector 컬럼에 수렴).
# 필요 secrets: DATABASE_URL, KRX_OPEN_API_KEY (ECOS_API_KEY 불필요 — fx_rate는 DB 캐시 히트)
#
# 선행 step(260705): mkt_fundamentals 재무 4열을 SSOT(mkt_finstat_q 분기재무)에서 파생 — **DART 0콜**.
# 신규 분기 공시분을 스냅샷 계산 전에 반영(구 market_val_agg는 done셋으로 갱신 불가였음). 분기 fetch는
# 별도(연 4회 공시 후, DART 키 필요 → fly/수동, GitHub에 키 미복제). derive는 0-DART라 여기서 안전.

name: market-val-weekly

on:
  schedule:
    # 매일 01:17 UTC = KST 10:17 (거래일 다음날 아침, 마감 데이터 확정 후). 화~토가 아닌 매일인 이유
    # (API QA 260705): KRX가 금요일 데이터를 지연 게시하는 실측 사례 — 일·월 실행이 없으면 지연
    # 복구분을 영영 못 담음(ISO주가 넘어가 수렴 기회 소멸). 배치가 멱등이라 매일 실행 부작용 0.
    - cron: "17 1 * * *"
  workflow_dispatch: {}  # 수동 실행

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync deps
        run: uv sync

      - name: Derive mkt_fundamentals from SSOT (mkt_finstat_q) — DART 0콜
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run python scripts/market_fund_quarterly.py --derive

      - name: Run weekly valuation snapshot
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          KRX_OPEN_API_KEY: ${{ secrets.KRX_OPEN_API_KEY }}
        run: uv run python scripts/market_val_weekly.py
