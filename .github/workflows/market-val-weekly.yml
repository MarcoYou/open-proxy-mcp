# 주간 밸류에이션 스냅샷 배치 — scripts/market_val_weekly.py (cron)
#
# 설계(260705): 매일 수집(전일 종가) → 같은 주 슬롯에 수렴 → 주 마지막 거래일만 영구 보존.
# 배치가 멱등·수렴형이라 매일 돌려도 주당 1스냅샷(무료티어 보호). KRX 4콜/일 (일 10,000 한도 대비 무해).
# 261018(재설계 5-1 쓰는 쪽): 시세의 주(主)는 일별 저장분 `krx_daily`(서버 갱신기가 월~토 아침에 기록), `krx_weekly` 는 **닫힌 주만**
#   (금요일이 저장되면 그 주를, 다음 주 첫 기록 때 그 앞 주를 옮겨 적는다). 이 워크플로는 시세를 직접 쓰지 않는다 — 서버가 못 했을 때만
#   `_ensure_krx_fresh` 가 예비로 기록한다. 이번 주 최신 점이 필요한 단계는 「닫힌 주 + 일별 최신일」(`krx_daily.WEEKLY_WITH_LATEST`)을 읽는다.
#   한 주 = ISO 주를 달력 연도 안으로 자른 것(`krx_retention.week_unit` — 연말 거래일이 다음 해 첫 주에 지워지지 않게).
# 갱신 대상: opm_val_firm(종목별 PER/PBR) · opm_val_market(시장·업종) · krx_listing · krx_stock_flags · krx_cap_agg ·
#   opm_val_fwd(선행 배수, 260918).
# 필요 secrets: DATABASE_URL, KRX_OPEN_API_KEY (ECOS_API_KEY 불필요 — fx_rate는 DB 캐시 히트)
#
# 선행 step(260705): mkt_fundamentals 재무 4열을 SSOT(mkt_finstat_q 분기재무)에서 파생 — **DART 0콜**.
# 신규 분기 공시분을 스냅샷 계산 전에 반영(옛 시장 aggregate 스크립트는 done셋 고정이라 갱신 불가였음 — 260902 삭제). 분기 fetch는
# 별도(연 4회 공시 후, DART 키 필요 → fly/수동, GitHub에 키 미복제). derive는 0-DART라 여기서 안전.

name: market-val-weekly

on:
  schedule:
    # 매일 01:17 UTC = KST 10:17 (거래일 다음날 아침, 마감 데이터 확정 후). 화~토가 아닌 매일인 이유
    # (API QA 260705): KRX가 금요일 데이터를 지연 게시하는 실측 사례 — 일·월 실행이 없으면 지연
    # 복구분을 영영 못 담음(ISO주가 넘어가 수렴 기회 소멸). 배치가 멱등이라 매일 실행 부작용 0.
    - cron: "17 1 * * *"
  workflow_dispatch:     # 수동 실행
    inputs:
      class_since:
        # 260829: 평소엔 올해분만 다시 쌓으면 된다(멱등·수렴). 컬럼을 새로 붙인 날처럼
        #   과거 행까지 채워야 할 때만 20200101 을 넣어 전 구간을 한 번 다시 돌린다.
        description: "업종분류 집계 재적재 시작월(기본 20260101 · 전 구간은 20200101)"
        required: false
        default: "20260101"
      scale_sweep:
        # 260829: 새 가드(회사 자기 규모 기준)를 기존 행에 소급 적용. 평소엔 불필요 —
        #   수집 단계가 이미 같은 가드를 통과시킨다. 가드를 고친 날에만 켠다.
        description: "기존 분기재무에 스케일 가드 소급 적용(yes/no)"
        required: false
        default: "no"
      market_history:
        # 260829: 과거 시장·KSIC섹터 밴드 재적재. 평소엔 불필요(과거는 안 변한다) — 컬럼을
        #   새로 붙였을 때처럼 옛 행을 다시 써야 할 때만 켠다. 80여 개 월말을 훑어 느리다.
        description: "과거 시장 밴드까지 다시 쌓기(yes/no)"
        required: false
        default: "no"

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30   # 260829: 과거 밴드 재적재(수동)를 켜면 15분으로는 잘린다
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.13"  # 260909 CI 실패 방지 — 정확한 버전은 버전 목록 조회를 건너뛴다. 올릴 때 9개 워크플로 함께

      - name: Sync deps
        run: uv sync

      # 260829: 파생·집계보다 **먼저** 온다. 오염된 분기값이 남은 채로 파생하면
      #   그 뒤 단계가 전부 오염을 물고 간다(실측: 코스닥 시장 PER 34개 시점 붕괴).
      - name: 스케일 가드 소급 적용 (수동 요청 시만 · DART·KRX 0콜)
        if: ${{ inputs.scale_sweep == 'yes' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run python scripts/scale_sweep_apply.py --apply

      - name: Derive mkt_fundamentals from SSOT (mkt_finstat_q) — DART 0콜
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run python scripts/market_fund_quarterly.py --derive

      # 260823 신설 — private wiki adjusted-price-timeseries §3 ④「유지 통합」의 미완 항목.
      #   수정주가 파이프라인은 「이벤트/수동」으로 설계돼 cron 이 없었고, 7/2 이후 7주 방치됐다.
      #   그 사이 상장주식수가 2배 이상 바뀐 종목이 62개인데 계수가 하나도 안 잡혔다.
      #   krx_weekly(시세)는 아래 배치가 매일 갱신해서 **겉으로는 멀쩡해 보였다** — 옆 테이블이
      #   최신이라 아무도 안 알아채는 형태다.
      #   콜: 리셋 스윕 = 신규 거래일 × 2시장 + 재개 시드 2 ≈ 4콜/일. 계수 생성은 0콜(로컬 조인).
      #   체크포인트가 --since 보다 우선이라 하루를 걸러도 다음 실행이 이어서 메운다.
      - name: 수정주가 — 기준가 리셋 증분 스윕 (KRX ~4콜)
        env:
          # 레포에 등록된 이름은 KRX_OPEN_API_KEY 하나다(KRX_API_KEY 는 없다).
          # 스크립트는 둘 다 받는다: os.getenv("KRX_API_KEY") or os.getenv("KRX_OPEN_API_KEY")
          KRX_OPEN_API_KEY: ${{ secrets.KRX_OPEN_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run python scripts/krx_base_resets.py --update

      - name: 수정주가 — 계수 재생성 (증분, DART·KRX 0콜)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run python scripts/adj_factor_v3.py

      - name: 시계열 해석 주의 딱지 갱신 (KRX·DART 0콜)
        # 260823 신설. `krx_stock_flags` 는 valuation 이 읽어 사용자에게 경고를 붙이는데
        #   **만드는 코드가 레포에 없어서** 260702 에 박제돼 있었다. 그 뒤 분할·감자한 종목은
        #   시계열이 끊겼는데도 경고 없이 나갔다.
        #   원장(krx_shares_ledger)에서 파생되므로 위 스윕 다음에 온다.
        # 🔴 260829: 이 단계에만 `env:` 가 빠져 있어 `KeyError: 'DATABASE_URL'` 로 죽었다.
        #   앞뒤 단계는 다 갖고 있는데 여기만 없었다 — 신설(260823) 때 빠뜨린 것이다.
        #   같은 워크플로가 08-28·08-29 두 번 연속 실패했다.
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run python scripts/krx_stock_flags.py

      - name: 업종분류 기준 시장·섹터 집계 (DART·KRX 0콜)
        # 260823: **분류는 월 1회여도 집계는 매일이어야 한다.** 업종분류는 느린 데이터라
        #   sector-class-monthly 가 월 1회 갱신하지만, 시총·재무는 매일 바뀐다. 집계를 월 1회 배치에만
        #   두면 사용자가 보는 섹터 배수가 최대 한 달 낡는다(실측: KSIC 8/21 vs 업종분류 7/31).
        #   스크립트가 현재월을 건너뛰므로 여기선 --since 로 최근만 훑어 비용을 줄인다.
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run python scripts/sector_val_backfill.py --since ${{ inputs.class_since || '20260101' }} --include-current

      - name: 과거 시장·섹터 밴드 재적재 (수동 요청 시만 · DART·KRX 0콜)
        if: ${{ inputs.market_history == 'yes' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run python scripts/market_val_history_backfill.py

      - name: Run weekly valuation snapshot
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          KRX_OPEN_API_KEY: ${{ secrets.KRX_OPEN_API_KEY }}
        run: uv run python scripts/market_val_weekly.py

      # 260903 신설 — `dividend_data` 가 「배당을 안 했다」와 「그해엔 상장 전이었다」를
      #   가르는 데 쓰는 표. 0 으로 메우면 무배당 목록에 상장 3년차가 섞인다
      #   (실측: 배당사 28곳이 FY2020 시점에 미상장 — 그만큼이 0회로 오독될 뻔했다).
      #   시세(krx_weekly + krx_daily) 파생이라 위 스냅샷 단계 **뒤**에 온다. 자체 크론을 만들지 않는 이유이기도 하다.
      #   요청마다 계산하면 279ms 라 도구 안에서는 못 쓴다 — 굽고 나면 3,257행/10ms.
      # 261018: 스냅샷 단계가 가드로 실패해도(일별 시세가 비었거나 반쪽) 이 아래 단계들은 각자 돈다 — 서로 입력이 아니다.
      #   job 은 실패(빨간불)로 남는다.
      - name: 상장 관측창 표 갱신 (DART·KRX 0콜)
        if: ${{ !cancelled() }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run python scripts/krx_listing.py

      # 260824 신설 — `trading_data` 의 시장·섹터 시총 시계열이 읽는 표.
      #   ★ `opm_val_market.cap`(위 스텝들이 만든 것)과 **다른 값**이다. 저쪽은 배수 분모를 가진
      #     종목만 더한 합이고(실측 KOSPI 5,497조/822사) 이쪽은 상장 전 종목이다(5,713조/942종목).
      #     둘 다 옳은데 뜻이 달라서 표를 나눴다 — 한 이름이 두 뜻을 가지면 하나는 틀리게 쓰인다.
      #   맨 뒤에 두는 이유: 시세가 이 워크플로 앞쪽(스냅샷 단계의 예비 기록)에서 갱신될 수 있으므로 그 뒤라야 최신 점을 잡는다.
      #   261018: 원천 = 닫힌 주(krx_weekly) + 일별 최신일(이번 주 임시 점). 주가 닫히면 다음 실행이 임시 점을 닫힌 날로 바꾼다.
      - name: 시장·섹터 시총 집계 (DART·KRX 0콜)
        if: ${{ !cancelled() }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run python scripts/krx_cap_agg.py

      # 260918 신설 — `price_multiple_data` 의 선행 PER·PBR(시장·업종 대분류·중분류)이 읽는 표 `opm_val_fwd`.
      #   원천은 수집 머신이 토요일 저녁에 올리는 추정치 이력(`fwd_hist`) + 업종분류 + 주간 시세의 시장 구분.
      #   새 날짜와 가장 최근 날짜만 계산해 평일엔 몇 초짜리 재계산 하나다(토요일 수집분은 일요일 아침 반영).
      #   수집 머신의 `fwd_agg` 에 넣지 않는 이유: 그쪽 송출이 날짜별로 행을 통째로 지우고 다시 넣는다.
      #   시세의 시장 구분을 쓰므로 위 시세 스냅샷 **뒤**에 온다.
      - name: 선행 배수 집계 — 시장·업종 (DART·KRX 0콜)
        if: ${{ !cancelled() }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run python scripts/fwd_val_weekly.py

      - name: 집계 확인 — 최신 시점이 들어왔나
        if: ${{ !cancelled() }}
        # 「성공」이 아니라 **산출물 변화**로 확인한다(법령 배치 교훈: 상류가 죽어도 초록불).
        #   스크립트 자체가 「섹터 합 == 시장 합」 항등을 전 시점에서 검사하고 어긋나면 실패한다.
        # 261018(재설계 5-1 쓰는 쪽): 기준 = 일별 시세 저장분의 최신 거래일(krx_daily). krx_weekly 는 닫힌 주만 담아 주중엔 지난 금요일이다.
        #   ① 시총 집계(krx_cap_agg) 최신 == 일별 최신일 — 아니면 실패.
        #   ② 밸류에이션 스냅샷(opm_val_firm·opm_val_market) 최신 snap_dd 가 일별 최신일과 다르면 경고, 2거래일 이상 뒤처지면 실패.
        #      종전 확인은 이 둘을 보지 않아, 스냅샷 단계가 건너뛰어져도(종목유형 조회 실패 등 — 로그 100회 중 3회) 초록불이었다.
        #      뒤처진 거래일 수는 일별 저장분(최근 7거래일)에 있는 「그 날 이후 거래일」 수로 센다(창 밖이면 7 이상).
        #   ③ krx_weekly 최신(닫힌 주)이 일별 저장분의 닫힌 주를 따라왔나 — 주간 닫기가 멈추면 경고.
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          uv run python - <<'PY'
          import os, psycopg
          from open_proxy_mcp.krx_daily import plan_weeks
          with psycopg.connect(os.environ["DATABASE_URL"], connect_timeout=20) as c:
              days = [r[0] for r in c.execute("SELECT DISTINCT trd_dd FROM krx_daily ORDER BY 1").fetchall()]
              if not days:
                  raise SystemExit("::error::일별 시세 저장분(krx_daily)이 비었다 — 서버 갱신기 확인")
              daily = days[-1]
              agg = c.execute("SELECT max(price_dd) FROM krx_cap_agg").fetchone()[0]
              wk  = c.execute("SELECT max(price_dd) FROM krx_weekly").fetchone()[0]
              print(f"일별 최신 {daily} · krx_cap_agg 최신 {agg} · krx_weekly(닫힌 주) 최신 {wk}")
              failed = []
              if agg != daily:
                  failed.append(f"시총 집계가 시세보다 낡음 ({agg} ≠ {daily}) — 재적재 실패")
              n = c.execute("SELECT count(*) FROM krx_cap_agg WHERE price_dd=%s", (agg,)).fetchone()[0]
              print(f"최신 시점 {n}행 (시장 2 + 업종 대분류·중분류 × 2시장)")
              for table, extra in (("opm_val_firm", ""), ("opm_val_market", " WHERE scheme='market'")):
                  snap = c.execute(f"SELECT max(snap_dd) FROM {table}{extra}").fetchone()[0]
                  behind = sum(1 for d in days if snap is None or d > snap)   # 창보다 이르면 창 전체(7) 이상
                  print(f"{table} 최신 snap_dd {snap} · 일별 최신 {daily} · 뒤처진 거래일 {behind}")
                  if behind >= 2:
                      failed.append(f"{table} 가 {behind}거래일 뒤처짐 ({snap} < {daily}) — 스냅샷 단계 실패·건너뜀")
                  elif behind == 1:
                      print(f"::warning::{table} 최신 snap_dd {snap} 가 일별 최신 {daily} 보다 하루 늦다 — 이번 실행의 스냅샷 단계가 건너뛰어졌다(다음 실행이 메운다)")
              closed = [w.last for w in plan_weeks(days) if w.closed]
              if closed and (wk or "") < closed[-1]:
                  print(f"::warning::krx_weekly 최신 {wk} 가 일별 저장분의 닫힌 주 {closed[-1]} 를 따라오지 못했다 — 주간 닫기 확인(다음 기록 때 다시 닫는다)")
              # 260918: 선행 배수가 추정치 이력의 최신 날짜를 따라왔나
              fh = c.execute("SELECT max(as_of) FROM fwd_hist").fetchone()[0]
              fv = c.execute("SELECT max(as_of) FROM opm_val_fwd").fetchone()[0]
              print(f"opm_val_fwd 최신 {fv} / fwd_hist 최신 {fh}")
              if fh and fv != fh:
                  failed.append(f"선행 배수가 추정치 이력보다 낡음 ({fv} < {fh}) — 집계 실패")
              for f in failed:
                  print(f"::error::{f}")
              if failed:
                  raise SystemExit(1)
          PY
