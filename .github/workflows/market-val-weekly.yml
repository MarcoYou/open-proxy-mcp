# 주간 밸류에이션 스냅샷 배치 — scripts/market_val_weekly.py (cron)
#
# 설계(260705): 매일 수집(전일 종가) → 같은 ISO주 슬롯에 수렴 → 주 마지막 거래일만 영구 보존.
# 배치가 멱등·수렴형이라 매일 돌려도 주당 1스냅샷(무료티어 보호). KRX 4콜/일 (일 10,000 한도 대비 무해).
# 갱신 대상: krx_weekly(시세) · firm_valuation_snapshot(종목별 PER/PBR) · mkt_val_history(시장·섹터,
#   260706 병합으로 섹터도 이 테이블 sector 컬럼에 수렴).
# 필요 secrets: DATABASE_URL, KRX_OPEN_API_KEY (ECOS_API_KEY 불필요 — fx_rate는 DB 캐시 히트)
#
# 선행 step(260705): mkt_fundamentals 재무 4열을 SSOT(mkt_finstat_q 분기재무)에서 파생 — **DART 0콜**.
# 신규 분기 공시분을 스냅샷 계산 전에 반영(구 market_val_agg는 done셋으로 갱신 불가였음). 분기 fetch는
# 별도(연 4회 공시 후, DART 키 필요 → fly/수동, GitHub에 키 미복제). derive는 0-DART라 여기서 안전.

name: market-val-weekly

on:
  schedule:
    # 매일 01:17 UTC = KST 10:17 (거래일 다음날 아침, 마감 데이터 확정 후). 화~토가 아닌 매일인 이유
    # (API QA 260705): KRX가 금요일 데이터를 지연 게시하는 실측 사례 — 일·월 실행이 없으면 지연
    # 복구분을 영영 못 담음(ISO주가 넘어가 수렴 기회 소멸). 배치가 멱등이라 매일 실행 부작용 0.
    - cron: "17 1 * * *"
  workflow_dispatch:     # 수동 실행
    inputs:
      wics_since:
        # 260829: 평소엔 올해분만 다시 쌓으면 된다(멱등·수렴). 컬럼을 새로 붙인 날처럼
        #   과거 행까지 채워야 할 때만 20200101 을 넣어 전 구간을 한 번 다시 돌린다.
        description: "WICS 집계 재적재 시작월(기본 20260101 · 전 구간은 20200101)"
        required: false
        default: "20260101"

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync deps
        run: uv sync

      - name: Derive mkt_fundamentals from SSOT (mkt_finstat_q) — DART 0콜
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run python scripts/market_fund_quarterly.py --derive

      # 260823 신설 — private wiki adjusted-price-timeseries §3 ④「유지 통합」의 미완 항목.
      #   수정주가 파이프라인은 「이벤트/수동」으로 설계돼 cron 이 없었고, 7/2 이후 7주 방치됐다.
      #   그 사이 상장주식수가 2배 이상 바뀐 종목이 62개인데 계수가 하나도 안 잡혔다.
      #   krx_weekly(시세)는 아래 배치가 매일 갱신해서 **겉으로는 멀쩡해 보였다** — 옆 테이블이
      #   최신이라 아무도 안 알아채는 형태다.
      #   콜: 리셋 스윕 = 신규 거래일 × 2시장 + 재개 시드 2 ≈ 4콜/일. 계수 생성은 0콜(로컬 조인).
      #   체크포인트가 --since 보다 우선이라 하루를 걸러도 다음 실행이 이어서 메운다.
      - name: 수정주가 — 기준가 리셋 증분 스윕 (KRX ~4콜)
        env:
          # 레포에 등록된 이름은 KRX_OPEN_API_KEY 하나다(KRX_API_KEY 는 없다).
          # 스크립트는 둘 다 받는다: os.getenv("KRX_API_KEY") or os.getenv("KRX_OPEN_API_KEY")
          KRX_OPEN_API_KEY: ${{ secrets.KRX_OPEN_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run python scripts/krx_base_resets.py --update

      - name: 수정주가 — 계수 재생성 (증분, DART·KRX 0콜)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run python scripts/adj_factor_v3.py

      - name: 시계열 해석 주의 딱지 갱신 (KRX·DART 0콜)
        # 260823 신설. `krx_stock_flags` 는 valuation 이 읽어 사용자에게 경고를 붙이는데
        #   **만드는 코드가 레포에 없어서** 260702 에 박제돼 있었다. 그 뒤 분할·감자한 종목은
        #   시계열이 끊겼는데도 경고 없이 나갔다.
        #   원장(krx_shares_ledger)에서 파생되므로 위 스윕 다음에 온다.
        # 🔴 260829: 이 단계에만 `env:` 가 빠져 있어 `KeyError: 'DATABASE_URL'` 로 죽었다.
        #   앞뒤 단계는 다 갖고 있는데 여기만 없었다 — 신설(260823) 때 빠뜨린 것이다.
        #   main 에는 고쳐져 있었고 beta 만 낡아 있었다(260829 실측).
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run python scripts/krx_stock_flags.py

      - name: WICS 기준 시장·섹터 집계 (DART·KRX 0콜)
        # 260823: **분류는 월 1회여도 집계는 매일이어야 한다.** WICS 업종분류는 느린 데이터라
        #   wics-monthly 가 월 1회 갱신하지만, 시총·재무는 매일 바뀐다. 집계를 월 1회 배치에만
        #   두면 사용자가 보는 섹터 배수가 최대 한 달 낡는다(실측: KSIC 8/21 vs WICS 7/31).
        #   스크립트가 현재월을 건너뛰므로 여기선 --since 로 최근만 훑어 비용을 줄인다.
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run python scripts/wics_val_backfill.py --since ${{ inputs.wics_since || '20260101' }} --include-current

      - name: Run weekly valuation snapshot
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          KRX_OPEN_API_KEY: ${{ secrets.KRX_OPEN_API_KEY }}
        run: uv run python scripts/market_val_weekly.py

      # 260824 신설 — `trading_data` 의 시장·섹터 시총 시계열이 읽는 표.
      #   ★ `opm_val_market.cap`(위 스텝들이 만든 것)과 **다른 값**이다. 저쪽은 배수 분모를 가진
      #     종목만 더한 합이고(실측 KOSPI 5,497조/822사) 이쪽은 상장 전 종목이다(5,713조/942종목).
      #     둘 다 옳은데 뜻이 달라서 표를 나눴다 — 한 이름이 두 뜻을 가지면 하나는 틀리게 쓰인다.
      #   맨 뒤에 두는 이유: `krx_weekly` 가 이 워크플로 앞쪽에서 갱신되므로 그 뒤라야 최신 주를 잡는다.
      - name: 시장·섹터 시총 집계 (DART·KRX 0콜)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run python scripts/krx_cap_agg.py

      - name: 집계 확인 — 최신 시점이 들어왔나
        # 「성공」이 아니라 **산출물 변화**로 확인한다(법령 배치 교훈: 상류가 죽어도 초록불).
        #   스크립트 자체가 「섹터 합 == 시장 합」 항등을 전 시점에서 검사하고 어긋나면 실패한다.
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          uv run python - <<'PY'
          import os, psycopg
          with psycopg.connect(os.environ["DATABASE_URL"], connect_timeout=20) as c:
              agg = c.execute("SELECT max(price_dd) FROM krx_cap_agg").fetchone()[0]
              wk  = c.execute("SELECT max(price_dd) FROM krx_weekly").fetchone()[0]
              print(f"krx_cap_agg 최신 {agg} / krx_weekly 최신 {wk}")
              if agg != wk:
                  raise SystemExit(f"::error::집계가 시세보다 낡음 ({agg} < {wk}) — 재적재 실패")
              n = c.execute("SELECT count(*) FROM krx_cap_agg WHERE price_dd=%s", (agg,)).fetchone()[0]
              print(f"최신 시점 {n}행 (시장 2 + WICS 대분류·하위업종 × 2시장)")
          PY
