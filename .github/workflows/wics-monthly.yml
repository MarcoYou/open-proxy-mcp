# WICS 업종분류 월간 수집 — scripts/refresh_wics.py (cron)
#
# 260823 신설. WiseIndex WICS(대분류 10 / 하위업종 28)는 우리 KSIC 하이브리드와 **다른 축**의
# 업종분류다. 벤더·리서치가 쓰는 기준이라 섹터 비교에서 KSIC 와 나란히 놓을 값이 있다.
#
# ★ 과거 관측은 못 만든다. WiseIndex 는 조회 시점의 구성종목만 주고 우리는 2026-08 부터 모았다.
#   그래서 두 갈래를 함께 쓴다:
#     · **관측** — 이 cron 이 월 1회 쌓는다. 오늘부터의 진짜 시점 분류다.
#     · **소급** — 과거 79개 월말 집계는 현재 분류를 적용한 것이다(사용자 결정, 260823).
#       벤더도 흔히 쓰는 방식이지만 「작년에 IT 가 아니던 회사를 작년 IT 에 넣는」 편향이 있다.
#       그래서 산출물이 `sector_asof` 로 **언제 관측한 분류인지** 밝힌다. 관측이 쌓일수록
#       소급 구간이 뒤로 밀린다.
#
# 월 1회인 이유: 업종분류는 분기·연 단위로 바뀌는 느린 데이터다. 주간으로 모으면 같은 값이
#   4배로 쌓이기만 한다. 월말 기준으로 12장/년이면 시계열로 충분하다.
#
# 콜: WiseIndex 트리 1 + 하위업종 28 ≈ 29콜/월. DART·KRX 0콜.

name: wics-monthly

on:
  schedule:
    # 매월 1일 02:30 UTC = KST 11:30. 스크립트 기본값이 「직전 금요일」이라
    # 1일에 돌리면 전월 마지막 금요일 전후를 잡는다 — 월말 스냅샷이 된다.
    - cron: "30 2 1 * *"
  workflow_dispatch:
    inputs:
      date:
        description: "기준일 YYYYMMDD (비우면 직전 금요일)"
        required: false

permissions:
  contents: write  # 정적 맵(JSON) 커밋백
  actions: write   # 커밋백 뒤 배포를 직접 부르기 위해 (260901)

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync deps
        run: uv sync

      - name: WICS 수집 — 정적 맵 + wise_sector 적재
        # 무결성 규칙(스크립트 내장): 대분류 10 미만 / 하위업종 20 미만 / 종목 1,000 미만이거나
        #   한 종목이 둘 이상 하위업종에 나타나면 **아무것도 쓰지 않고 중단**한다.
        #   불완전 응답을 절반만 반영하면 섹터 집계가 조용히 틀어지므로 전부-아니면-전무가 맞다.
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            uv run python scripts/refresh_wics.py --date "${{ inputs.date }}"
          else
            uv run python scripts/refresh_wics.py
          fi

      - name: 적재 확인 — 시점이 늘었나
        # 「성공」이 아니라 **산출물 변화**로 확인한다(260823 법령 배치 교훈: 상류가 죽어도 초록불).
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          uv run python - <<'PY'
          import os, psycopg
          with psycopg.connect(os.environ["DATABASE_URL"], connect_timeout=20) as c:
              rows, snaps, latest = c.execute(
                  "SELECT count(*), count(DISTINCT snap_dd), max(snap_dd) FROM wise_sector").fetchone()
              print(f"wise_sector {rows:,}행 / {snaps}개 시점 · 최신 {latest}")
              n = c.execute("SELECT count(*) FROM wise_sector WHERE snap_dd=%s", (latest,)).fetchone()[0]
              if n < 1000:
                  raise SystemExit(f"::error::최신 시점 종목이 {n}개 — 1,000 미만이면 불완전 수집")
              # krx_weekly 와 조인되는지(섹터 집계가 실제로 되는 상태인가)
              j = c.execute("""SELECT count(*) FROM wise_sector w
                               JOIN krx_weekly k ON k.ticker=w.ticker AND k.price_dd=w.snap_dd
                               WHERE w.snap_dd=%s""", (latest,)).fetchone()[0]
              print(f"krx_weekly 정확일자 조인: {j:,}/{n:,}")
              if j == 0:
                  print("::warning::그 날짜에 krx_weekly 포인트가 없다 — 소비 측은 "
                        "가장 가까운 price_dd 로 조인해야 한다(주간 수렴이라 금요일이 아닐 수 있음)")
          PY

      - name: WICS 기준 시장·섹터 집계 (DART·KRX 0콜)
        # 분류만 모아두면 쓸 수 없다 — krx_weekly × dart_finstat 와 합쳐 배수·시총을 낸다.
        #   계산은 KSIC 백필과 **같은 함수**(_pit_fy·_ttm_ni·_mrq_eq)를 재사용하고
        #   갈아끼우는 것은 섹터 버킷 하나뿐이다.
        #   과거 월말은 소급(현재 분류를 과거에 적용) — 산출물이 sector_asof 로 그 사실을 남긴다.
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run python scripts/wics_val_backfill.py

      - name: 정적 맵 커밋 (실질 변경 시)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # refreshedAt 만 바뀐 건 무시 — 분류가 실제로 바뀐 경우에만 커밋한다.
          if git diff --quiet -- open_proxy_mcp/data/wics/wics_map.json; then
            echo "변경 없음 — 커밋 생략"
          elif [ "$(git diff -U0 -- open_proxy_mcp/data/wics/wics_map.json | grep -c '^[+-][^+-]')" -le 2 ]; then
            echo "refreshedAt 만 변경 — 되돌리고 커밋 생략"
            git checkout -- open_proxy_mcp/data/wics/wics_map.json
          else
            AS_OF=$(python3 -c "import json;print(json.load(open('open_proxy_mcp/data/wics/wics_map.json'))['meta']['asOf'])")
            git add open_proxy_mcp/data/wics/wics_map.json
            git commit \
              -m "chore(wics): 월간 업종분류 갱신 — ${AS_OF} 기준" \
              -m "WiseIndex WICS 대분류 10 / 하위업종 28. DART·KRX 0콜." \
              -m "Co-Authored-By: Claude Opus 5 <noreply@anthropic.com>"
            git push
            # 데이터 자동 커밋은 `on: push` 를 트리거하지 않는다 — GITHUB_TOKEN 으로 민 푸시는
            # 워크플로를 깨우지 않는 것이 GitHub 기본 동작이다. 그래서 커밋은 main 에 올라가는데
            # **live 는 옛 데이터인 채로 남는다**(260901 실측: 법령 8/31 커밋이 배포되지 않아
            # live 2,725조 vs main 2,734조). 커밋했을 때만 배포를 직접 부른다.
            gh workflow run deploy.yml --ref main \
              && echo "🚀 배포 요청함" || echo "🔴 배포 요청 실패 — 사람이 밀어야 한다"
            echo "✅ 커밋·푸시 완료 (${AS_OF})"
          fi
