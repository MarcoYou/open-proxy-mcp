name: Wiki Link Policy Lint

on:
  push:
    branches: [main]
    paths:
      - 'wiki/**'
      - '**/*.md'
      - 'scripts/wiki_lint.py'
      - 'scripts/gen_index.py'
      - 'scripts/check_documentation_contract.py'
      - 'open_proxy_mcp/services/business_details.py'
      - 'docs/features/business-details.md'
      - 'docs/features/en/business-details.md'
      - 'README.md'
      - 'README_ENG.md'
      - '.github/workflows/wiki-lint.yml'
  pull_request:
    paths:
      - 'wiki/**'
      - '**/*.md'
      - 'scripts/wiki_lint.py'
      - 'scripts/gen_index.py'
      - 'scripts/check_documentation_contract.py'
      - 'open_proxy_mcp/services/business_details.py'
      - 'docs/features/business-details.md'
      - 'docs/features/en/business-details.md'
      - 'README.md'
      - 'README_ENG.md'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.13"  # 260909 CI 실패 방지 — 정확한 버전은 버전 목록 조회를 건너뛴다. 올릴 때 9개 워크플로 함께
      - name: Install dependencies
        run: uv sync --dev
      - name: Verify wiki_index counts are generated (not hand-drifted)
        run: uv run python scripts/gen_index.py --check
      - name: Run wiki_lint (strict)
        run: uv run python scripts/wiki_lint.py --strict
      - name: Check public documentation contract
        run: uv run python scripts/check_documentation_contract.py
